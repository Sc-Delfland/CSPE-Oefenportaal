<!DOCTYPE html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oefenapp Mens &amp; Activiteit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Carlito:ital,wght@0,400;0,700;1,400;1,700&family=Comic+Neue:ital,wght@0,400;0,700;1,400;1,700&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: opdrachtenboekje — smalle inhoudsrail links, één 'pagina' rechts; punten in de kantlijn zoals in het cspe-boekje */
:root{
  --paper:#f5f0e6; --sheet:#ffffff; --ink:#13213a; --muted:#56637c; --line:#d6dde9;
  --blue:#9a5600; --blue-soft:#fbecd3; --blue-ink:#ffffff;
  --coral:#d9482b; --coral-soft:#fde8e3;
  --ok:#17804f; --ok-soft:#dff3e8; --bad:#c2342a; --bad-soft:#fbe3e1; --warn:#9a6a10; --warn-soft:#fbf0d9;
  --bubble-c:#f1f4f9; --stage:#efe3cc; --stage2:#e2d0ad;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1522; --sheet:#162034; --ink:#e5ebf6; --muted:#9ba8c2; --line:#2a3752;
  --blue:#f0b440; --blue-soft:#3a2a10; --blue-ink:#0e1522;
  --coral:#ff7b5e; --coral-soft:#3a1d17;
  --ok:#4cc58c; --ok-soft:#133426; --bad:#ff6d62; --bad-soft:#3b1a1a; --warn:#e6b450; --warn-soft:#352a12;
  --bubble-c:#1e2a42; --stage:#1b2740; --stage2:#24345a; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0e1522; --sheet:#162034; --ink:#e5ebf6; --muted:#9ba8c2; --line:#2a3752;
  --blue:#f0b440; --blue-soft:#3a2a10; --blue-ink:#0e1522;
  --coral:#ff7b5e; --coral-soft:#3a1d17;
  --ok:#4cc58c; --ok-soft:#133426; --bad:#ff6d62; --bad-soft:#3b1a1a; --warn:#e6b450; --warn-soft:#352a12;
  --bubble-c:#1e2a42; --stage:#1b2740; --stage2:#24345a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.4rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
.wrap{max-width:1120px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 12px;border-bottom:2px solid var(--ink);margin-bottom:20px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:800}
.topctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;font-weight:700;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.who{font-size:.9rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.ghost{border-color:var(--line)}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* home */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:start;margin-bottom:28px}
.hero p.lead{font-size:1.08rem;margin-top:10px;max-width:60ch}
.card{background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:18px}
.form{display:grid;gap:12px}
.form label{font-weight:700;font-size:.92rem;display:grid;gap:6px}
.covers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.cover{background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;padding:0;text-align:left;display:flex;flex-direction:column;min-height:300px;box-shadow:4px 4px 0 var(--ink);transition:transform .15s}
.cover:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.cover .band{background:var(--blue);color:var(--blue-ink);padding:12px 16px;font-family:var(--f-display);font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cover .band small{font-family:var(--f-body);font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.cover .body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.cover .place{font-family:var(--f-display);font-size:1.25rem;font-weight:800}
.cover .meta{font-size:.85rem;color:var(--muted)}
.cover .prog{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;background:var(--sheet)}
.chip.done{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.chip.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip.blue{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}

/* case */
.casegrid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:4px}
.rail .back{margin-bottom:10px}
.tab{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;font-weight:700}
.tab .n{font-family:var(--f-display);font-weight:800;font-size:1.05rem;color:var(--muted)}
.tab .p{font-size:.78rem;color:var(--muted);font-weight:700}
.tab[aria-current="true"]{background:var(--ink);color:var(--sheet)}
.tab[aria-current="true"] .n,.tab[aria-current="true"] .p{color:var(--sheet)}
.tab .st{width:10px;height:10px;border-radius:50%;background:var(--line);justify-self:end}
.tab .st.ok{background:var(--ok)}
.sheet{background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:28px;min-width:0}
.opd{display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 12px}
.opd .marg{font-family:var(--f-display);font-weight:800;font-size:1.05rem;padding-top:4px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.opd .marg .pt{color:var(--coral)}
.opd .marg .nr{font-size:1.6rem;line-height:1}
.opd .content{display:flex;flex-direction:column;gap:16px;min-width:0}
.boekje{border-left:4px solid var(--blue);background:var(--blue-soft);padding:14px 16px;border-radius:0 10px 10px 0;display:flex;flex-direction:column;gap:8px}
.boekje ul{margin:0;padding-left:20px}
.rule{font-size:.9rem;font-style:italic;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fact{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.fact b{display:block;font-family:var(--f-display);font-size:1.4rem}
details.docent{border:1.5px dashed var(--line);border-radius:10px;padding:12px 14px}
details.docent summary{font-weight:700;cursor:pointer}
details.docent .crit{margin-top:10px;display:grid;gap:10px}
details.docent ul{margin:4px 0 0;padding-left:20px}

/* timer */
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.timer .clock{font-family:var(--f-display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums;min-width:4.2ch}

/* quiz */
.q{display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 12px;text-align:left;min-height:48px}
.opt .l{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.opt[aria-pressed="true"] .l{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--blue)}
.expl{font-size:.92rem;border-left:3px solid var(--line);padding-left:10px;color:var(--muted)}

/* chat */
.chatgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.chatbox{border:1.5px solid var(--line);border-radius:12px;display:flex;flex-direction:column;height:560px;min-width:0;background:var(--sheet)}
.chathead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1.5px solid var(--line)}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--coral-soft);color:var(--coral);flex:none}
.log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.c{background:var(--bubble-c);border-bottom-left-radius:4px;align-self:flex-start}
.msg.s{background:var(--blue);color:var(--blue-ink);border-bottom-right-radius:4px;align-self:flex-end}
.msg.a{align-self:center;background:transparent;border:1.5px dashed var(--line);font-style:italic;color:var(--muted);font-size:.9rem;max-width:92%;text-align:center}
.msg.n.warnnote{color:var(--warn);font-weight:700}
.msg.n{align-self:center;font-size:.88rem;color:var(--muted);text-align:center;max-width:92%}
.msg em{font-style:italic;opacity:.85}
.typing{align-self:flex-start;color:var(--muted);font-size:.88rem;font-style:italic}
.composer{display:flex;gap:8px;padding:10px;border-top:1.5px solid var(--line)}
.composer input{flex:1;min-width:0}
.actions{display:flex;flex-direction:column;gap:12px;min-width:0}
.agroup{display:flex;flex-direction:column;gap:6px}
.agroup h4{margin:0;font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.abtn{border:1.5px solid var(--line);background:var(--sheet);border-radius:9px;padding:8px 10px;text-align:left;font-size:.92rem;min-height:40px}
.abtn:hover{border-color:var(--blue)}
.abtn.used{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.prep{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:.95rem}
.check input{width:20px;height:20px;flex:none;margin-top:2px}
.aiswitch{display:flex;align-items:center;gap:8px;font-size:.88rem}
.aiswitch input{width:18px;height:18px}

/* assessment */
.assess{display:flex;flex-direction:column;gap:14px}
.sec{border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.sec .sh{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 14px;background:var(--paper);font-weight:700}
.sec .sh .sc{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.sec ul{list-style:none;margin:0;padding:6px 14px 12px;display:grid;gap:6px}
.sec li{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;font-size:.95rem}
.mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;margin-top:1px}
.mark.y{background:var(--ok);color:var(--sheet)}
.mark.n{background:var(--bad);color:var(--sheet)}
.tip{display:block;font-size:.86rem;color:var(--muted)}
.total{display:flex;align-items:baseline;gap:10px;font-family:var(--f-display)}
.total b{font-size:2.2rem;font-weight:800}

/* order */
.ordergrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.pool,.seq{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.pool h4,.seq h4{margin:0 0 2px;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stepc{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;border:1.5px solid var(--line);background:var(--sheet);border-radius:9px;padding:8px 10px;text-align:left;font-size:.93rem;min-height:44px}
.stepc .no{font-family:var(--f-display);font-weight:800;color:var(--blue)}
.stepc .mv{display:flex;gap:4px}
.stepc .mv button{border:1.5px solid var(--line);background:var(--sheet);border-radius:6px;width:32px;height:32px;display:grid;place-items:center;font-weight:800}
.stepc.right{border-color:var(--ok);background:var(--ok-soft)}
.stepc.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mat{border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.88rem;font-weight:700;min-height:104px}
.mat svg{width:34px;height:34px}
.mat[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.mat.right{border-color:var(--ok);background:var(--ok-soft)}
.mat.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* film */
.player{border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--sheet)}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;background:linear-gradient(180deg,var(--stage) 0 68%,var(--stage2) 68% 100%);overflow:hidden}
.stage .fig{position:absolute;bottom:8%;width:22%;transition:transform .4s}
.stage .fig.s{left:10%}
.stage .fig.c{right:10%}
.stage .fig.talk{animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3%)}}
.stage .tag{position:absolute;bottom:2%;font-size:.75rem;font-weight:700;background:var(--sheet);border:1.5px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.stage .tag.s{left:12%}
.stage .tag.c{right:12%}
.stage .bubble{position:absolute;top:7%;max-width:44%;background:var(--sheet);border:1.5px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:clamp(.78rem,1.8vw,1rem);font-weight:700;line-height:1.3}
.stage .bubble.s{left:6%}
.stage .bubble.c{right:6%}
.stage .actcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34%;background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:clamp(.7rem,1.5vw,.9rem)}
.stage .actcard svg{width:clamp(28px,6vw,48px);height:clamp(28px,6vw,48px);color:var(--ink)}
.stage .flash{position:absolute;inset:0;border:6px solid var(--coral);pointer-events:none;opacity:0;transition:opacity .2s}
.stage .flash.on{opacity:1}
.stage .fig svg{width:100%;height:auto;display:block}
.stage .playcover{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 45%,transparent);cursor:pointer}
.stage .playcover span{background:var(--sheet);color:var(--ink);border-radius:999px;padding:12px 22px;font-weight:800;font-family:var(--f-display)}
.subs{padding:10px 14px;min-height:3.2em;border-top:1.5px solid var(--line);font-size:.95rem}
.ctrl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1.5px solid var(--line);flex-wrap:wrap}
.bar{flex:1;min-width:140px;height:10px;background:var(--line);border-radius:5px;position:relative;cursor:pointer}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:5px}
.bar .flag{position:absolute;top:-4px;width:4px;height:18px;background:var(--coral);border-radius:2px}
.time{font-variant-numeric:tabular-nums;font-size:.88rem;color:var(--muted)}
.scorepick{display:flex;gap:8px;flex-wrap:wrap}
.scorepick button{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;font-weight:700}
.scorepick button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.errlist{display:grid;gap:6px;list-style:none;padding:0;margin:0}
.errlist li{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:.93rem}
video{width:100%;border-radius:10px;background:#000}
.kw{width:100%;border-collapse:collapse;font-size:.92rem}
.kw th,.kw td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.kw td.c{text-align:center;width:64px}
.kw input{width:18px;height:18px}
.tablewrap{overflow-x:auto}
.restab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.restab th,.restab td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left}
.restab td.r,.restab th.r{text-align:right}
.restab tfoot td{font-weight:800;font-family:var(--f-display);font-size:1.1rem;border-bottom:0}
.note{font-size:.82rem;color:var(--muted);max-width:75ch}
.inline-confirm{border:1.5px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.disp{display:flex;margin-top:6px}
.disp[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.facet{gap:14px}
.qq{font-weight:700}
.mcl{display:grid;gap:6px}
.mco{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}
.mco input{width:18px;height:18px}
.mco.right{background:var(--ok-soft)}.mco.wrong{background:var(--bad-soft)}
.mx,.qtab{border-collapse:collapse;font-size:.95rem;min-width:100%}
.mx th,.mx td,.qtab th,.qtab td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:middle}
.mx th{font-size:.85rem;text-align:center}
.mx td.c{text-align:center;width:96px;white-space:nowrap}
.mx td.c input{width:18px;height:18px}
.mx td.c .ok{color:var(--ok);font-weight:800;margin-left:4px}
.mx tr.right td:first-child{background:var(--ok-soft)}.mx tr.wrong td:first-child{background:var(--bad-soft)}
.qtab caption{font-weight:700;text-align:left;padding-bottom:6px}
.qtab thead th{background:var(--blue-soft)}
.mt{display:grid;gap:8px}
.mtr{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.mtr .tip{grid-column:2}
.mtr.right{background:var(--ok-soft)}.mtr.wrong{background:var(--bad-soft)}
@media (max-width:560px){.mtr{grid-template-columns:1fr}.mtr .tip{grid-column:1}.mx td.c{width:64px}}
.guide{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:10px;padding:10px 14px;border:1.5px solid var(--line);background:var(--sheet)}
.guide svg{width:22px;height:22px;flex:none}

<p><b>Subjectief</b> = een mening, gevoel of inschatting van de schrijver. Let op woorden als: <i>leuk, lekker, veel, weinig, grote belangstelling, erg vrolijk, had gezonder gemogen, heeft zin, vond het niet leuk</i>.</p>

</ul>`;

/* getal lezen zoals een leerling het typt: 48 · 48,00 · € 48,00 · 1.290 · 1.290,50 */
function parseNum(s){
  s=String(s==null?'':s).replace(/€|\s/g,'');
  if(!s) return NaN;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  return /^-?\d*\.?\d+$/.test(s)?parseFloat(s):NaN;
}
/* berekening uitrekenen: 12 x 4,00 · (6 x 2,25) + (6 x 2,50) */
function calcExpr(s){
  let t=String(s||'').trim(); if(!t) return NaN;
  t=t.replace(/€/g,'').replace(/[x×X]/g,'*').replace(/:/g,'/').replace(/−/g,'-');
  t=t.replace(/(\d)\.(\d{3})(?!\d)/g,'$1$2').replace(/,/g,'.');
  if(!/^[\d\s.+\-*/()]+$/.test(t) || !/[+\-*/]/.test(t)) return NaN;
  try{ const v=Function('"use strict";return ('+t+')')(); return isFinite(v)?v:NaN; }catch(e){ return NaN; }
}

/* =========================================================
   ROOSTER-HULPJES (ook gebruikt in de data)
   G = { 'slot|act': [namen] }
   ========================================================= */
function cell(G,s,a){ return G[s+'|'+a]||[]; }
function cellsOf(G,n){ return Object.entries(G).filter(([k,v])=>v.includes(n)).map(([k])=>k.split('|')); }
function cnt(G,n){ return cellsOf(G,n).length; }
function has(G,n,s,a){ return cell(G,s,a).includes(n); }
function free(G,n,s){ return !cellsOf(G,n).some(x=>x[0]===s); }
function onlyActs(G,n,acts){ return cellsOf(G,n).every(x=>acts.includes(x[1])); }
function notDay(G,n,d){ return !cellsOf(G,n).some(x=>x[0].startsWith(d)); }
function matchSol(G,r,n){ const mine=cellsOf(G,n).map(x=>x.join('|')).sort(); const want=r.sol[n].map(x=>x.join('|')).sort(); return mine.length===want.length&&mine.every((x,i)=>x===want[i]); }

/* =========================================================
   SCORING
   ========================================================= */
function scoreSec(sec, okList){
  const n=okList.filter(Boolean).length, wrong=okList.length-n;
  let pts=0;
  if(sec.mode==='minus') pts=Math.max(0, sec.max-wrong);
  else if(sec.mode==='all') pts= wrong===0?sec.max:0;
  else if(sec.mode==='count') pts=Math.min(sec.max,n);
  else { for(const [min,p] of sec.bands){ if(n>=min){pts=p;break;} } }
  return pts;
}
function secHTML(code,title,max,pts,items){
  return `<div class="sec"><div class="sh"><span>${esc(code)}${code?' · ':''}${esc(title)}</span><span class="sc">${pts}/${max}</span></div>
    <ul>${items.map(i=>`<li><span class="mark ${i.ok?'y':'n'}">${i.ok?'✓':'✗'}</span><span>${esc(i.l)}${!i.ok&&i.tip?`<span class="tip">Tip: ${esc(i.tip)}</span>`:''}</span></li>`).join('')}</ul></div>`;
}
function bandText(sec){
  if(sec.mode==='minus') return `alle aspecten juist = ${sec.max}p, per fout −1`;
  if(sec.mode==='count') return `per juist aspect 1p`;
  if(sec.mode==='all') return `alle aspecten juist`;
  return sec.bands.map(([m,p])=>`${m}+ juist = ${p}p`).join(' · ');
}

  if(!rt.done && !rt.retry && saved && saved.ans){ rt.ans=saved.ans.slice(); rt.done=true; }

/* =========================================================
   C2 — KOSTENOVERZICHT
   ========================================================= */
function kLines(c){ return c.kosten.secs.flatMap(s=>s.lines); }
function kValues(c,st){
  const v={}, z={};
  kLines(c).forEach(l=>{ v[l.id]=parseNum(st.p[l.id]); z[l.id]=isFinite(v[l.id])?v[l.id]:0; });
  return {v,z};
}
function kCorrect(c){ const cv={}; kLines(c).forEach(l=>{ cv[l.id]= l.ans!==undefined? l.ans : r2(l.f(cv)); }); return cv; }
function kFieldOk(c,l,st,vals){
  const v=vals.v[l.id];
  let ok;
  if(l.ans!==undefined) ok=approx(v,l.ans);
  else { const exp=r2(l.f(vals.z)); ok = exp===0 ? (l.id==='kort' && (!isFinite(v)||v===0)) : approx(v,exp); }
  if(l.pick && st.pick[l.id]!==l.pick.a) ok=false;
  return ok;
}
function kAantalOk(l,st){ return l.aantal===undefined || approx(parseNum(st.a[l.id]), l.aantal) || (l.id==='elast' && !String(st.a[l.id]||'').trim()); }
function kConclOk(c,st,vals){
  const K=c.kosten, last=kLines(c).slice(-1)[0].id; const tot=vals.v[last]; if(!isFinite(tot)||!tot) return false;
  const diff=r2(K.concl.budget-tot); const want=diff>=0?'ja':'nee';
  return st.concl===want && approx(parseNum(st.amt), Math.abs(diff));
}
function kScore(c,st){
  const K=c.kosten, vals=kValues(c,st), byId=Object.fromEntries(kLines(c).map(l=>[l.id,l]));
  const items=K.aspects.map(a=>{
    let ok = a.concl ? kConclOk(c,st,vals) : a.ids.every(id=>kFieldOk(c,byId[id],st,vals) && (!a.aantal||!K.aantalIn||kAantalOk(byId[id],st)));
    return {l:a.l, ok, tip: ok?'':kTip(c,a,byId)};
  });
  return {items, pts:scoreSec(K.score, items.map(i=>i.ok))};
}
function kTip(c,a,byId){ if(a.concl) return 'Trek de totale kosten af van het beschikbare bedrag. Is het antwoord negatief? Dan is er een tekort.'; const l=byId[a.ids.find(id=>byId[id].hint)]; return l?l.hint:''; }
function kostenView(c){

  const vals=kValues(c,rt), review=rt.done, sc=review?kScore(c,rt):null;
  const fcls=(l)=> review? (kFieldOk(c,l,rt,vals)?'right':'wrong') : '';

  const row=(l)=>{

    return `<tr class="${l.f?'tot':''}">

      <td><div class="prod"><span>${esc(l.l)}${bb()&&l.hint&&!review?`<button class="hq" data-kh="${l.id}" aria-label="hulp bij ${esc(l.l)}" aria-expanded="${!!rt.hint[l.id]}">?</button>`:''}</span>
        ${l.pick?`<select data-kp="${l.id}" class="${review?(rt.pick[l.id]===l.pick.a?'right':'wrong'):''}" ${review?'disabled':''} aria-label="${esc(l.pick.label||'welke workshop')}"><option value="">${esc(l.pick.label||'welke workshop')}?</option>${l.pick.o.map(o=>`<option ${rt.pick[l.id]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:''}
        ${rt.hint[l.id]&&bb()&&!review?`<span class="hint">${esc(l.hint)}</span>`:''}</div></td>
      <td class="b">${l.f&&!l.calc?'':`<input data-kb="${l.id}" value="${esc(rt.b[l.id]||'')}" placeholder="${l.f?'':'bijv. 12 x 4,00'}" aria-label="berekening ${esc(l.l)}" ${review?'disabled':''}>
        <div class="calcres" id="cr-${l.id}">${isFinite(calc)?`= ${eur(calc)} <button data-kc="${l.id}" ${review?'disabled':''}>→ prijs</button>`:''}</div>`}</td>
      <td class="p"><div class="eur">€<input class="num ${fcls(l)}" data-kv="${l.id}" value="${esc(rt.p[l.id]||'')}" aria-label="prijs ${esc(l.l)}" inputmode="decimal" ${review?'disabled':''}></div></td>
    </tr>`;
  };
  const cv=kCorrect(c);
  return `<div class="opd">${opdHead(2,5)}<div class="content">
    <h2>Een kostenoverzicht maken</h2>
    <div class="kgrid">
        <div class="boekje"><p>${esc(K.text)}</p>
          <h3>Informatie voor de berekening</h3><ul>${K.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>
          <h3>Uitvoering</h3><ul>${K.uitvoering.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>
        <aside class="kinfo card" aria-label="Prijslijsten">${K.info}</aside>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        ${review?`<div class="total"><b>${sc.pts}</b><span>van 5 punten</span></div>${secHTML('C2',K.title,5,sc.pts,sc.items)}`:''}
        <div class="tablewrap">
          <h3 style="margin-bottom:6px">${esc(K.title)}</h3>
          ${K.secs.map(s=>`<table class="ktab"><caption>${esc(s.h)}</caption><thead><tr><th>aantal</th><th>product</th><th>(berekening)</th><th>prijs in €</th></tr></thead><tbody>${s.lines.map(row).join('')}</tbody></table>`).join('')}
        </div>
        <div class="concl">
          <p><b>${esc(K.concl.q)}</b> Kies de juiste optie en vul het bedrag in.</p>
          ${K.concl.calcLine?`<label style="display:grid;gap:4px">Noteer je berekening<input data-kcl value="${esc(rt.calcLine||'')}" ${review?'disabled':''}></label>`:''}
          <label><input type="radio" name="kcon" value="ja" ${rt.concl==='ja'?'checked':''} ${review?'disabled':''}> ${esc(K.concl.ja)}</label>
          <label><input type="radio" name="kcon" value="nee" ${rt.concl==='nee'?'checked':''} ${review?'disabled':''}> ${esc(K.concl.nee)}</label>
          <label>bedrag: € <input class="num amt ${review?(kConclOk(c,rt,vals)?'right':'wrong'):''}" data-kamt value="${esc(rt.amt||'')}" inputmode="decimal" aria-label="bedrag bij de conclusie" ${review?'disabled':''}></label>
        </div>
        ${review?`<details class="help"><summary>Bekijk de voorbeelduitwerking</summary><div>
            <div class="tablewrap"><table class="qtab vbu"><thead><tr><th>product</th><th>berekening</th><th>prijs in €</th></tr></thead><tbody>
            ${kLines(c).map(l=>`<tr><td>${l.aantal!==undefined?l.aantal+' · ':''}${esc(l.l)}${l.pick?' ('+esc(l.pick.a)+')':''}</td><td>${esc(l.calc||'')}</td><td class="num">${eur(cv[l.id])}</td></tr>`).join('')}
            </tbody></table></div>
            <p><b>Conclusie:</b> ${(()=>{ const t=cv[kLines(c).slice(-1)[0].id], d=r2(K.concl.budget-t); return d>=0? esc(K.concl.ja)+' '+eur(d) : esc(K.concl.nee)+' '+eur(-d); })()}</p>
            <p class="small muted">Rekende je ergens verkeerd? Dan rekent de app daarna met jouw getal door (doorrekenfout). Je verliest dan maar één keer punten.</p></div></details>
          <div class="row"><button class="btn ghost" id="k-retry">Opnieuw maken</button><button class="btn ghost" id="k-edit">Verbeteren</button>${nextBtn('o3','Naar opdracht 3a')}</div>`
        :`<div class="row"><button class="btn primary" id="k-done">Inleveren en nakijken</button></div>`}
    </div>
  </div></div>`;
}
function bindKosten(c){
  bindGo(); const rt=runtime.ks;
  $$('[data-kv]').forEach(i=>i.oninput=()=>{ rt.p[i.dataset.kv]=i.value; });
  $$('[data-ka]').forEach(i=>i.oninput=()=>{ rt.a[i.dataset.ka]=i.value; });

/* =========================================================
   C3a — THEORIEVRAGEN ZOALS IN FACET
   ========================================================= */
function prepQ(q){
  if(q.t==='mc') return shufQ(q);
  if(q.t==='matrix') return {...q, rows:shuffle(q.rows)};
  if(q.t==='match') return {...q, items:shuffle(q.items)};
  return q;
}
function qRight(q,ans){
  if(ans===undefined) return false;
  if(q.t==='mc') return ans===q.a;
  if(q.t==='matrix') return q.rows.every((r,i)=>ans[i]===r.a);
  if(q.t==='match') return q.items.every((it,i)=>ans[i]===it.a);
  return false;
}
function qComplete(q,ans){
  if(ans===undefined) return false;
  if(q.t==='mc') return true;
  const n=q.t==='matrix'?q.rows.length:q.items.length;
  return Array.isArray(ans) && ans.length===n && ans.every(v=>v!==undefined&&v!==null);
}
function qBody(q,ans,review,k=0){
  let h=(q.ctx?`<p>${esc(q.ctx)}</p>`:'')+`<p class="qq">${esc(q.q)}</p>`;
  if(q.t==='mc'){
    h+=`<div class="mcl">${q.o.map((o,j)=>{const cls=review?(j===q.a?'right':(j===ans?'wrong':'')):''; return `<label class="mco ${cls}"><input type="radio" name="mc${k}" data-mc="${j}" ${ans===j?'checked':''} ${review?'disabled':''}><span>${esc(o)}</span></label>`;}).join('')}</div>`;
  } else if(q.t==='matrix'){
    h+=`<div class="tablewrap"><table class="mx"><thead><tr><th></th>${q.cols.map(cn=>`<th>${esc(cn)}</th>`).join('')}</tr></thead><tbody>${q.rows.map((r,i)=>`<tr class="${review?(ans&&ans[i]===r.a?'right':'wrong'):''}"><td>${esc(r.s)}</td>${q.cols.map((_,j)=>`<td class="c"><input type="radio" name="mx${k}_${i}" data-mx="${i}:${j}" aria-label="${esc(r.s)}: ${esc(q.cols[j])}" ${ans&&ans[i]===j?'checked':''} ${review?'disabled':''}>${review&&j===r.a?'<span class="ok">✓</span>':''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  } else if(q.t==='match'){
    h+=`<div class="mt">${q.items.map((it,i)=>`<div class="mtr ${review?(ans&&ans[i]===it.a?'right':'wrong'):''}"><b>${esc(it.l)}</b><select data-mt="${i}" aria-label="${esc(it.l)}" ${review?'disabled':''}><option value="">kies …</option>${q.o.map((o,j)=>`<option value="${j}" ${ans&&ans[i]===j?'selected':''}>${esc(o)}</option>`).join('')}</select>${review&&!(ans&&ans[i]===it.a)?`<span class="tip">Goed: ${esc(q.o[it.a])}</span>`:''}</div>`).join('')}</div>`;
  }
  return h;
}
function quizView(c){
  if(runtime.quiz && runtime.quiz.lv!==S.level) runtime.quiz=null;
  const set=()=>bb()?c.quizBB:c.quizKB;
  const rt = runtime.quiz ||= {i:0, ans:[], done:false, lv:S.level, set:set().map(prepQ)};
  const r=R(c.id).o3;
  if(rt.done || (r && r.set && r.lv===S.level && !rt.retry && rt.ans.length===0)){
    const ans = rt.done? rt.ans : r.ans; const st = rt.done? rt.set : r.set;
    const score = st.filter((q,i)=>qRight(q,ans[i])).length;
    return `<div class="opd">${opdHead('3a',8)}<div class="content">
      <h2>Theorievragen — uitslag</h2>
      <div class="total"><b>${score}</b><span>van ${st.length} punten</span></div>
      ${st.map((q,i)=>`<div class="q card"><div class="qhead"><span class="eyebrow">Vraag ${i+1} · 1p</span><span class="chip ${qRight(q,ans[i])?'done':'bad'}">${qRight(q,ans[i])?'goed':'fout'}</span></div>${qBody(q,ans[i],true,i)}<p class="expl">${esc(q.e)}</p></div>`).join('')}
      <p class="small muted">Net als in Facet krijg je bij een vraag met meer regels alleen het punt als alle regels goed zijn.</p>
      <div class="row"><button class="btn ghost" id="q-retry">Opnieuw maken</button>${nextBtn('o4','Naar opdracht 3b')}</div>
    </div></div>`;
  }
  const q=rt.set[rt.i], a=rt.ans[rt.i];
  return `<div class="opd">${opdHead('3a',8)}<div class="content">
    <h2>Vragen maken in Facet</h2>
    ${rt.i===0?`<div class="boekje"><p>Maak de theorievragen. Bij elke vraag kun je 1 punt halen.</p></div>`:''}
    <div class="q card facet">
      <div class="qhead"><span class="eyebrow">Vraag ${rt.i+1} van ${rt.set.length} · 1p</span><span class="dots">${rt.set.map((_,i)=>`<i class="${i<=rt.i?'on':''}"></i>`).join('')}</span></div>
      ${qBody(q,a,false,rt.i)}
      <div class="row" style="justify-content:space-between">
        <button class="btn ghost sm" id="q-prev" ${rt.i===0?'disabled':''}>Vorige</button>
        <button class="btn primary" id="q-next" ${qComplete(q,a)?'':'disabled'}>${rt.i===rt.set.length-1?'Inleveren':'Volgende'}</button>
      </div>
    </div>
  </div></div>`;
}
function bindQuiz(c){
  const rt=runtime.quiz; bindGo();
  const q=rt.set&&rt.set[rt.i];
  const upd=()=>{ const n=$('#q-next'); if(n) n.disabled=!qComplete(q,rt.ans[rt.i]); };
  $$('[data-mc]').forEach(b=>b.onchange=()=>{ rt.ans[rt.i]=+b.dataset.mc; upd(); });
  $$('[data-mx]').forEach(b=>b.onchange=()=>{ const [i,j]=b.dataset.mx.split(':').map(Number); const arr=(rt.ans[rt.i] ||= Array(q.rows.length).fill(undefined)); arr[i]=j; upd(); });
  $$('[data-mt]').forEach(b=>b.onchange=()=>{ const i=+b.dataset.mt; const arr=(rt.ans[rt.i] ||= Array(q.items.length).fill(undefined)); arr[i]=b.value===''?undefined:+b.value; upd(); });
  const n=$('#q-next'); if(n) n.onclick=()=>{ if(rt.i<rt.set.length-1){rt.i++; render();} else { rt.done=true; const score=rt.set.filter((qq,i)=>qRight(qq,rt.ans[i])).length; R(c.id).o3={score,ans:rt.ans.slice(),set:rt.set,lv:S.level}; save(); render(); window.scrollTo(0,0);} };
  const p=$('#q-prev'); if(p) p.onclick=()=>{rt.i--; render();};
  const rr=$('#q-retry'); if(rr) rr.onclick=()=>{ runtime.quiz={i:0,ans:[],done:false,retry:true,lv:S.level,set:shuffle(bb()?c.quizBB:c.quizKB).map(prepQ)}; render(); };
}

/* =========================================================
   C3b — ACTIVITEITEN BEOORDELEN (kaartenbak)
   ========================================================= */
const kOpts=(K,card)=>card.opts||K.ontw;
function card1Ok(card,a){ if(!a) return false; const sel=(a.k||[]).slice().sort().join(); return sel===card.a.slice().sort().join() && (card.dg===undefined || a.dg===card.dg); }
function card2Ok(card,a){ if(!a) return false; return !!a.g1===card.a[0] && !!a.g2===card.a[1] && !!a.no===(!card.a[0]&&!card.a[1]) && (a.g1||a.g2||a.no); }
function kaartScore(c,st){
  const K=c.kaarten; const ok=[...K.deel1.map((cd,i)=>card1Ok(cd,st.d1[i])), ...K.deel2.map((cd,i)=>card2Ok(cd,st.d2[i]))];
  const n=ok.filter(Boolean).length, tot=ok.length, ratio=n/tot;
  const pts= ratio>=1?4: ratio>=.75?3: ratio>=.5?2: ratio>=.25?1:0;
  return {n,tot,pts,ok};
}
function kaartenView(c){
  const K=c.kaarten;
  const rt=runtime.kt ||= (()=>{ const s=R(c.id).o4; return s&&s.st? {...JSON.parse(JSON.stringify(s.st)), step:3} : {d1:[],d2:[],step:1}; })();
  const review=rt.step===3, sc=review?kaartScore(c,rt):null;
  const meta=(cd)=>`<p class="kmeta">aantal deelnemers: ${esc(cd.n)} · tijdsduur: ${esc(cd.tijd)}</p>`;
  const d1=(cd,i)=>{
    const a=rt.d1[i]||{}, lock=rt.step!==1, opts=kOpts(K,cd);
    return `<article class="kaart ${review?(card1Ok(cd,a)?'ok':'nok'):''}"><div class="kh"><b>${esc(cd.t)}</b><span>kaart ${i+1}</span></div><div class="kb">
      <p>${esc(cd.d)}</p>${meta(cd)}
      ${cd.dg!==undefined?`<p class="kq">Doelgroep</p>${K.doelgroepen.map((g,j)=>{ const cls=review?(j===cd.dg?(a.dg===j?'right':'miss'):(a.dg===j?'wrong':'')):''; return `<label class="ck ${cls}"><input type="radio" name="dg${i}" data-dg="${i}:${j}" ${a.dg===j?'checked':''} ${lock?'disabled':''}>${esc(g)}</label>`; }).join('')}`:''}
      <p class="kq">${cd.dg!==undefined?'Deze activiteit stimuleert vooral de …':'Deze activiteit'}</p>
      ${opts.map((o,j)=>{ const on=(a.k||[]).includes(j), right=cd.a.includes(j); const cls=review?(on&&right?'right':on&&!right?'wrong':!on&&right?'miss':''):''; return `<label class="ck ${cls}"><input type="checkbox" data-k1="${i}:${j}" ${on?'checked':''} ${lock?'disabled':''}>${esc(o)}</label>`; }).join('')}
      ${review&&!card1Ok(cd,a)?`<p class="kf">${esc(cd.e)}</p>`:''}
    </div></article>`;
  };
  const d2=(cd,i)=>{
    const a=rt.d2[i]||{}, lock=rt.step!==2;
    const box=(k,l,want)=>{ const on=!!a[k]; const cls=review?(on&&want?'right':on&&!want?'wrong':!on&&want?'miss':''):''; return `<label class="ck ${cls}"><input type="checkbox" data-k2="${i}:${k}" ${on?'checked':''} ${lock?'disabled':''}>${esc(l)}</label>`; };
    return `<article class="kaart ${review?(card2Ok(cd,a)?'ok':'nok'):''}"><div class="kh"><b>${esc(cd.t)}</b><span>kaart ${K.deel1.length+i+1}</span></div><div class="kb">
      <p>${esc(cd.d)}</p>${meta(cd)}
      <p class="kq">Deze activiteit</p>${cd.kenm.map(k=>`<span class="fixed">${esc(k)}</span>`).join('')}
      <p class="kq">Geschikt?</p>
      ${box('g1','is geschikt voor groep 1',cd.a[0])}${box('g2','is geschikt voor groep 2',cd.a[1])}${box('no','is ongeschikt voor deze groepen',!cd.a[0]&&!cd.a[1])}
      ${review&&!card2Ok(cd,a)?`<p class="kf">${esc(cd.e)}</p>`:''}
    </div></article>`;
  };
  const d1done=K.deel1.every((cd,i)=>{ const a=rt.d1[i]; return a&&(a.k||[]).length&&(cd.dg===undefined||a.dg!==undefined); });
  const d2done=K.deel2.every((cd,i)=>{ const a=rt.d2[i]; return a&&(a.g1||a.g2||a.no); });
  return `<div class="opd">${opdHead('3b',4)}<div class="content">
    <h2>Activiteiten beoordelen</h2>
    <div class="boekje"><p>${esc(K.text)}</p>
      <p><b>Deel 1:</b> vul de ${K.deel1.length} kaarten voor de kaartenbak in. ${K.deel1[0].dg!==undefined?'Klik de juiste doelgroep en de juiste ontwikkelingen aan.':'Zet een vinkje bij alle juiste kenmerken.'}<br>
      <b>Deel 2:</b> je ziet ${K.deel2.length} juist ingevulde kaarten. Lees de informatie over de twee groepen en vul in of de activiteit geschikt of ongeschikt is voor de groep(en).</p></div>
    <details class="help" ${bb()?'open':''}><summary>Uitleg: wat stimuleert een activiteit?</summary><div>${UITLEG_KENM}${K.doelgroepInfo||''}</div></details>
    ${review?`<div class="total"><b>${sc.pts}</b><span>van 4 punten · ${sc.n} van ${sc.tot} kaarten helemaal goed</span></div><p class="small muted">Groen = goed aangeklikt · rood = had je niet moeten aanklikken · gestippeld = had je wel moeten aanklikken.</p>`:''}
    <h3>Deel 1</h3>
    <div class="kaarten">${K.deel1.map(d1).join('')}</div>
    ${rt.step===1?`<div class="row"><button class="btn primary" id="kt-next" ${d1done?'':'disabled'}>Volgend onderdeel</button><span class="small muted">Let op: je kunt daarna niet meer terug naar deel 1.</span></div>`:''}
    ${rt.step>=2?`<h3>Deel 2</h3>
      <div class="groepen">${K.groepen.map(g=>`<div class="groep"><b>${esc(g.n)}</b><p>${esc(g.d)}</p></div>`).join('')}</div>
      <div class="kaarten">${K.deel2.map(d2).join('')}</div>`:''}
    ${rt.step===2?`<div class="row"><button class="btn primary" id="kt-done" ${d2done?'':'disabled'}>Inleveren en nakijken</button></div>`:''}
    ${review?`<div class="row"><button class="btn ghost" id="kt-retry">Opnieuw maken</button>${nextBtn('o5','Naar opdracht 3c')}</div>`:''}
  </div></div>`;
}
function bindKaarten(c){
  bindGo(); const rt=runtime.kt, K=c.kaarten;
  const keep=()=>{ const y=window.scrollY; render(); window.scrollTo(0,y); };
  $$('[data-k1]').forEach(b=>b.onchange=()=>{ const [i,j]=b.dataset.k1.split(':').map(Number); const a=(rt.d1[i] ||= {k:[]}); a.k ||= []; a.k = b.checked? [...new Set([...a.k,j])] : a.k.filter(x=>x!==j); keep(); });
  $$('[data-dg]').forEach(b=>b.onchange=()=>{ const [i,j]=b.dataset.dg.split(':').map(Number); const a=(rt.d1[i] ||= {k:[]}); a.dg=j; keep(); });
  $$('[data-k2]').forEach(b=>b.onchange=()=>{ const [i,k]=b.dataset.k2.split(':'); const a=(rt.d2[+i] ||= {}); a[k]=b.checked; if(k==='no'&&b.checked){a.g1=false;a.g2=false;} if(k!=='no'&&b.checked) a.no=false; keep(); });
  const n=$('#kt-next'); if(n) n.onclick=()=>{ rt.step=2; keep(); };
  const d=$('#kt-done'); if(d) d.onclick=()=>{ rt.step=3; const sc=kaartScore(c,rt); R(c.id).o4={score:sc.pts, n:sc.n, tot:sc.tot, st:JSON.parse(JSON.stringify({d1:rt.d1,d2:rt.d2}))}; save(); render(); window.scrollTo(0,0); };
  const r=$('#kt-retry'); if(r) r.onclick=()=>{ runtime.kt={d1:[],d2:[],step:1}; delete R(c.id).o4; save(); render(); window.scrollTo(0,0); };
}

/* =========================================================
   C3c — ROOSTER INVULLEN
   ========================================================= */
function rScore(c,G){
  return c.rooster.secs.map(s=>{ const items=s.items.map(i=>({l:i.l, tip:i.tip, ok:!!i.ok(G)})); return {code:s.code,title:s.title,max:s.max,pts:scoreSec(s,items.map(i=>i.ok)),items}; });
}
function rWarnings(c,G){
  const RO=c.rooster, w=[];
  RO.people.forEach(p=>{ const slots={}; cellsOf(G,p.n).forEach(([s])=>{ slots[s]=(slots[s]||0)+1; }); Object.entries(slots).forEach(([s,k])=>{ if(k>1) w.push(`${p.n} staat ${RO.slots.find(x=>x.id===s).l} ${RO.slots.find(x=>x.id===s).sub} op twee plekken tegelijk.`); }); });
  RO.slots.forEach(s=>RO.acts.forEach(a=>{ if(RO.closed&&RO.closed(s.id,a.id)) return; const n=cell(G,s.id,a.id).length; if(n>RO.max) w.push(`${a.l}, ${s.l} ${s.sub}: meer dan ${RO.max} ${c.id==='A'?'vrijwilligers':c.id==='B'?'cliënten':'medewerkers'}.`); }));
  return w;
}
function roosterView(c){
  const RO=c.rooster;
  const rt=runtime.ro ||= (()=>{ const s=R(c.id).o5; return s&&s.G? {G:JSON.parse(JSON.stringify(s.G)), sel:null, done:true} : {G:{}, sel:RO.people[0].n, done:false}; })();
  const G=rt.G, review=rt.done, res=review?rScore(c,G):null, tot=res?res.reduce((a,s)=>a+s.pts,0):0;
  const warns=rWarnings(c,G);
  const grid=(GG,isSol)=>`<div class="rscroll"><table class="rtab ${isSol?'sol':''}"><thead><tr><th class="slot">${c.id==='A'?'ronde':'dag / dagdeel'}</th>${RO.acts.map(a=>`<th>${esc(a.l)}</th>`).join('')}</tr></thead><tbody>
    ${RO.slots.map(s=>`<tr><th class="slot">${esc(s.l)}<small>${esc(s.sub)}</small></th>${RO.acts.map(a=>{
      if(RO.closed&&RO.closed(s.id,a.id)) return `<td class="closed">${esc(RO.closedL||'')}</td>`;
      const names=cell(GG,s.id,a.id), info=RO.info?RO.info(s.id,a.id):'';
      const bad=!isSol && names.length>RO.max;
      return `<td class="cell ${bad?'bad':''}" ${isSol||review?'':`tabindex="0" role="button" aria-label="${esc(a.l)}, ${esc(s.l)} ${esc(s.sub)}: ${names.length?esc(names.join(', ')):'leeg'}. ${rt.sel?'Plaats '+esc(rt.sel):''}"`} data-cell="${s.id}|${a.id}">${info?`<span class="ci">${esc(info)}</span>`:''}${names.map(n=>{ const cls=(review&&!isSol&&RO.sol[n]&&c.id!=='C')?(RO.sol[n].some(x=>x[0]===s.id&&x[1]===a.id)?'right':'wrong'):''; return isSol||review?`<span class="nm ${cls}">${esc(n)}</span>`:`<button class="nm" data-rm="${s.id}|${a.id}|${esc(n)}" aria-label="${esc(n)} weghalen">${esc(n)} ×</button>`; }).join('')}</td>`;
    }).join('')}</tr>`).join('')}
  </tbody></table></div>`;
  const solG={}; Object.entries(RO.sol).forEach(([n,cells])=>cells.forEach(([s,a])=>{ (solG[s+'|'+a] ||= []).push(n); }));
  return `<div class="opd">${opdHead('3c',6)}<div class="content">
    <h2>${esc(RO.title)}</h2>
    <div class="boekje"><p>${esc(RO.text)}</p><h3>Uitvoering</h3><ul>${RO.uitvoering.map(u=>`<li>${esc(u)}</li>`).join('')}</ul><p><b>Tip:</b> ${esc(RO.tip)}</p></div>
    ${RO.extra||''}
    ${review?`<div class="total"><b>${tot}</b><span>van 6 punten</span></div>${res.map(s=>secHTML(s.code?'C3c-'+s.code:'C3c',s.title,s.max,s.pts,s.items)).join('')}`:''}
    <h3>${c.id==='A'?'Vrijwilligers':c.id==='B'?'Cliënten':'Medewerkers'}: voorkeuren en beschikbaarheid</h3>
    <div class="people">${RO.people.map(p=>{ const k=cnt(G,p.n); const cc=k===p.k?'full':k>p.k?'over':''; return `<button class="pers" data-person="${esc(p.n)}" aria-pressed="${rt.sel===p.n}" ${review?'disabled':''}><b><span>${esc(p.n)}</span>${bb()||review?`<span class="cnt ${cc}">${k} / ${p.k}</span>`:`<span class="cnt">${p.k} ${esc(RO.unit)}</span>`}</b><ul>${p.w.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></button>`; }).join('')}</div>
    ${!review?`<div class="placebar" aria-live="polite">${rt.sel?`Je plaatst nu: <b>${esc(rt.sel)}</b>. Klik op een vakje in het rooster. Klik op een naam in het rooster om die weg te halen.`:'Klik eerst op een naam.'}</div>`:''}
    ${grid(G,false)}
    ${warns.length&&!review?`<ul class="warnlist">${warns.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}
    ${review?`<details class="help"><summary>Bekijk een juist ingevuld rooster</summary><div>${RO.solNote?`<p class="small muted">${esc(RO.solNote)}</p>`:''}${grid(solG,true)}</div></details>
      <div class="row"><button class="btn ghost" id="ro-retry">Opnieuw maken</button><button class="btn ghost" id="ro-edit">Verbeteren</button>${nextBtn('res','Naar de uitslag')}</div>`
    :`<div class="row"><button class="btn primary" id="ro-done">Inleveren en nakijken</button><button class="btn ghost" id="ro-clear">Rooster leegmaken</button></div>`}
  </div></div>`;
}
function bindRooster(c){
  bindGo(); const rt=runtime.ro, RO=c.rooster;
  const keep=()=>{ const y=window.scrollY; render(); window.scrollTo(0,y); };
  $$('[data-person]').forEach(b=>b.onclick=()=>{ rt.sel=b.dataset.person; keep(); });
  const place=(key)=>{ if(!rt.sel) return; const arr=(rt.G[key] ||= []); if(!arr.includes(rt.sel)) arr.push(rt.sel); keep(); };
  $$('td.cell[data-cell]').forEach(td=>{ td.onclick=(e)=>{ if(e.target.closest('[data-rm]')) return; place(td.dataset.cell); }; td.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); place(td.dataset.cell); } }; });
  $$('[data-rm]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); const [s,a,n]=b.dataset.rm.split('|'); const k=s+'|'+a; rt.G[k]=(rt.G[k]||[]).filter(x=>x!==n); if(!rt.G[k].length) delete rt.G[k]; keep(); });
  const d=$('#ro-done'); if(d) d.onclick=()=>{ rt.done=true; const res=rScore(c,rt.G); R(c.id).o5={score:res.reduce((a,s)=>a+s.pts,0), secs:res.map(s=>({code:s.code,pts:s.pts,max:s.max})), G:JSON.parse(JSON.stringify(rt.G))}; save(); render(); window.scrollTo(0,0); };
  const cl=$('#ro-clear'); if(cl) cl.onclick=()=>{ if(cl.dataset.sure){ rt.G={}; keep(); } else { cl.dataset.sure='1'; cl.textContent='Zeker weten? Klik nog een keer'; } };
  const r=$('#ro-retry'); if(r) r.onclick=()=>{ runtime.ro={G:{},sel:RO.people[0].n,done:false}; delete R(c.id).o5; save(); render(); window.scrollTo(0,0); };
  const e=$('#ro-edit'); if(e) e.onclick=()=>{ rt.done=false; rt.sel=RO.people[0].n; render(); };
}

/* =========================================================
   UITSLAG
   ========================================================= */
function resView(c){
  const r=S.results[c.id]||{};
  const tot=PARTS.reduce((a,[k])=>a+(r[k]?r[k].score:0),0), doneAll=PARTS.every(([k])=>r[k]);
  const c3=['o3','o4','o5'].reduce((a,k)=>a+(r[k]?r[k].score:0),0);
  return `<div class="opd"><div class="marg"><span class="nr">Σ</span></div><div class="content">
    <h2>Uitslag oefenexamen ${c.id} · ${esc(c.place)}</h2>
    <p class="muted">${esc(S.name||'Naam nog niet ingevuld')}${S.klas?' · '+esc(S.klas):''} · niveau ${S.level.toUpperCase()}</p>
    <div class="tablewrap"><table class="restab"><thead><tr><th>Opdracht</th><th></th><th class="r">Score</th><th class="r">Max</th></tr></thead><tbody>
      ${PARTS.map(([k,code,l])=>`<tr><td>${code}</td><td>${esc(l)}${k==='o5'&&r[k]&&r[k].secs&&r[k].secs.length>1?`<div class="small muted">${r[k].secs.map(s=>'C3c-'+s.code+' '+s.pts+'/'+s.max).join(' · ')}</div>`:''}</td><td class="r">${r[k]?r[k].score:'–'}</td><td class="r">${MAX[k]}</td></tr>`).join('')}
      <tr><td></td><td class="small muted">subtotaal C3 (Facet)</td><td class="r small muted">${c3}</td><td class="r small muted">18</td></tr>
    </tbody><tfoot><tr><td colspan="2">Totaal onderdeel C</td><td class="r">${tot}</td><td class="r">25</td></tr></tfoot></table></div>
    ${!doneAll?'<p class="chip warn" style="align-self:flex-start">Nog niet alle opdrachten gemaakt.</p>':''}
    <div class="card mailbox">
      <h3>Uitslag naar je docent sturen</h3>
      ${!S.name?'<p class="chip warn" style="align-self:flex-start">Vul eerst je naam in op de startpagina.</p>':''}
      <label for="docent" style="font-weight:700">Naar welke docent?</label>
      <select id="docent"><option value="">Kies je docent …</option>${DOCENTEN.map((d,i)=>`<option value="${i}" ${S.docent===i?'selected':''}>${esc(d.naam)}</option>`).join('')}</select>
      <div class="row">
        <a class="btn primary ${S.docent==null||!S.name?'disabled':''}" id="res-mail" target="_blank" rel="noopener" href="${S.docent!=null&&S.name?esc(mailLink(c)):'#'}" aria-disabled="${S.docent==null||!S.name}">Mail naar docent</a>
        <button class="btn ghost" id="res-copy">Uitslag kopiëren</button><span class="small muted" id="res-msg"></span>
      </div>
      <p class="small muted">Er opent een nieuwe e-mail in Outlook met je uitslag erin. Controleer hem en klik op <b>Verzenden</b>. Werkt de knop niet? Kopieer dan je uitslag en plak die in een mail of in Teams.</p>
    </div>
    <textarea id="res-out" hidden readonly></textarea>
    <p class="note">Dit is een oefenscore: bij het echte cspe beoordeelt de examinator je werk.</p>
  </div></div>`;
}
function resultText(c){
  const r=S.results[c.id]||{}; const g=k=>r[k]?r[k].score:'-';
  const tot=PARTS.reduce((a,[k])=>a+(r[k]?r[k].score:0),0);
  return `Oefenapp Mens & Activiteit – oefenexamen ${c.id} (${c.place})\n${S.name||'-'} ${S.klas||''} · ${S.level.toUpperCase()}\n`+
    PARTS.map(([k,code,l])=>`${code} ${l}: ${g(k)}/${MAX[k]}`).join('\n')+`\nTotaal: ${tot}/25`;
}
function mailLink(c){
  const d=DOCENTEN[S.docent]; if(!d) return '#';
  const subject=`Oefenapp M&A – examen ${c.id} – ${S.name||'leerling'}${S.klas?' '+S.klas:''}`;
  return 'https://outlook.office.com/mail/deeplink/compose?to='+encodeURIComponent(d.mail)+'&subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(resultText(c).replace(/\n/g,'\r\n'));
}
function copyText(txt,area,msg){
  const fallback=()=>{ area.hidden=false; area.value=txt; area.style.minHeight='160px'; area.focus(); area.select(); msg.textContent='Selecteer en kopieer de tekst hieronder.'; };
  try{ navigator.clipboard.writeText(txt).then(()=>{msg.textContent='Gekopieerd.';},fallback); }catch(e){ fallback(); }
}
function bindRes(c){
  $('#res-copy').onclick=()=>copyText(resultText(c),$('#res-out'),$('#res-msg'));
  $('#docent').onchange=e=>{ S.docent=e.target.value===''?null:+e.target.value; save(); render(); };
  $('#res-mail').onclick=e=>{ if(S.docent==null||!S.name){ e.preventDefault(); } };
}

render();

</script>
</body></html>
