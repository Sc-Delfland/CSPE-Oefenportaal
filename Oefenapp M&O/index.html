<!DOCTYPE html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oefenapp Mens &amp; Omgeving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Carlito:ital,wght@0,400;0,700;1,400;1,700&family=Comic+Neue:ital,wght@0,400;0,700;1,400;1,700&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: opdrachtenboekje — smalle inhoudsrail links, één 'pagina' rechts; punten in de kantlijn zoals in het cspe-boekje */
:root{
  --paper:#eef4f0; --sheet:#ffffff; --ink:#13213a; --muted:#56637c; --line:#d6dde9;
  --blue:#17724a; --blue-soft:#e0f1e7; --blue-ink:#ffffff;
  --coral:#d9482b; --coral-soft:#fde8e3;
  --ok:#17804f; --ok-soft:#dff3e8; --bad:#c2342a; --bad-soft:#fbe3e1; --warn:#9a6a10; --warn-soft:#fbf0d9;
  --bubble-c:#f1f4f9; --stage:#dcebe2; --stage2:#c5dccd;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1522; --sheet:#162034; --ink:#e5ebf6; --muted:#9ba8c2; --line:#2a3752;
  --blue:#5fd08e; --blue-soft:#163526; --blue-ink:#0e1522;
  --coral:#ff7b5e; --coral-soft:#3a1d17;
  --ok:#4cc58c; --ok-soft:#133426; --bad:#ff6d62; --bad-soft:#3b1a1a; --warn:#e6b450; --warn-soft:#352a12;
  --bubble-c:#1e2a42; --stage:#1b2740; --stage2:#24345a; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0e1522; --sheet:#162034; --ink:#e5ebf6; --muted:#9ba8c2; --line:#2a3752;
  --blue:#5fd08e; --blue-soft:#163526; --blue-ink:#0e1522;
  --coral:#ff7b5e; --coral-soft:#3a1d17;
  --ok:#4cc58c; --ok-soft:#133426; --bad:#ff6d62; --bad-soft:#3b1a1a; --warn:#e6b450; --warn-soft:#352a12;
  --bubble-c:#1e2a42; --stage:#1b2740; --stage2:#24345a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.4rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
.wrap{max-width:1120px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 12px;border-bottom:2px solid var(--ink);margin-bottom:20px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:800}
.topctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;font-weight:700;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.who{font-size:.9rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.ghost{border-color:var(--line)}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* home */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:start;margin-bottom:28px}
.hero p.lead{font-size:1.08rem;margin-top:10px;max-width:60ch}
.card{background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:18px}
.form{display:grid;gap:12px}
.form label{font-weight:700;font-size:.92rem;display:grid;gap:6px}
.covers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.cover{background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;padding:0;text-align:left;display:flex;flex-direction:column;min-height:300px;box-shadow:4px 4px 0 var(--ink);transition:transform .15s}
.cover:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.cover .band{background:var(--blue);color:var(--blue-ink);padding:12px 16px;font-family:var(--f-display);font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cover .band small{font-family:var(--f-body);font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.cover .body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.cover .place{font-family:var(--f-display);font-size:1.25rem;font-weight:800}
.cover .meta{font-size:.85rem;color:var(--muted)}
.cover .prog{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;background:var(--sheet)}
.chip.done{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.chip.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip.blue{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}

/* case */
.casegrid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:4px}
.rail .back{margin-bottom:10px}
.tab{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;font-weight:700}
.tab .n{font-family:var(--f-display);font-weight:800;font-size:1.05rem;color:var(--muted)}
.tab .p{font-size:.78rem;color:var(--muted);font-weight:700}
.tab[aria-current="true"]{background:var(--ink);color:var(--sheet)}
.tab[aria-current="true"] .n,.tab[aria-current="true"] .p{color:var(--sheet)}
.tab .st{width:10px;height:10px;border-radius:50%;background:var(--line);justify-self:end}
.tab .st.ok{background:var(--ok)}
.sheet{background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:28px;min-width:0}
.opd{display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 12px}
.opd .marg{font-family:var(--f-display);font-weight:800;font-size:1.05rem;padding-top:4px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.opd .marg .pt{color:var(--coral)}
.opd .marg .nr{font-size:1.6rem;line-height:1}
.opd .content{display:flex;flex-direction:column;gap:16px;min-width:0}
.boekje{border-left:4px solid var(--blue);background:var(--blue-soft);padding:14px 16px;border-radius:0 10px 10px 0;display:flex;flex-direction:column;gap:8px}
.boekje ul{margin:0;padding-left:20px}
.rule{font-size:.9rem;font-style:italic;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fact{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.fact b{display:block;font-family:var(--f-display);font-size:1.4rem}
details.docent{border:1.5px dashed var(--line);border-radius:10px;padding:12px 14px}
details.docent summary{font-weight:700;cursor:pointer}
details.docent .crit{margin-top:10px;display:grid;gap:10px}
details.docent ul{margin:4px 0 0;padding-left:20px}

/* timer */
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.timer .clock{font-family:var(--f-display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums;min-width:4.2ch}

/* quiz */
.q{display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 12px;text-align:left;min-height:48px}
.opt .l{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.opt[aria-pressed="true"] .l{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--blue)}
.expl{font-size:.92rem;border-left:3px solid var(--line);padding-left:10px;color:var(--muted)}

/* chat */
.chatgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.chatbox{border:1.5px solid var(--line);border-radius:12px;display:flex;flex-direction:column;height:560px;min-width:0;background:var(--sheet)}
.chathead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1.5px solid var(--line)}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--coral-soft);color:var(--coral);flex:none}
.log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.c{background:var(--bubble-c);border-bottom-left-radius:4px;align-self:flex-start}
.msg.s{background:var(--blue);color:var(--blue-ink);border-bottom-right-radius:4px;align-self:flex-end}
.msg.a{align-self:center;background:transparent;border:1.5px dashed var(--line);font-style:italic;color:var(--muted);font-size:.9rem;max-width:92%;text-align:center}
.msg.n.warnnote{color:var(--warn);font-weight:700}
.msg.n{align-self:center;font-size:.88rem;color:var(--muted);text-align:center;max-width:92%}
.msg em{font-style:italic;opacity:.85}
.typing{align-self:flex-start;color:var(--muted);font-size:.88rem;font-style:italic}
.composer{display:flex;gap:8px;padding:10px;border-top:1.5px solid var(--line)}
.composer input{flex:1;min-width:0}
.actions{display:flex;flex-direction:column;gap:12px;min-width:0}
.agroup{display:flex;flex-direction:column;gap:6px}
.agroup h4{margin:0;font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.abtn{border:1.5px solid var(--line);background:var(--sheet);border-radius:9px;padding:8px 10px;text-align:left;font-size:.92rem;min-height:40px}
.abtn:hover{border-color:var(--blue)}
.abtn.used{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.prep{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:.95rem}
.check input{width:20px;height:20px;flex:none;margin-top:2px}
.aiswitch{display:flex;align-items:center;gap:8px;font-size:.88rem}
.aiswitch input{width:18px;height:18px}

/* assessment */
.assess{display:flex;flex-direction:column;gap:14px}
.sec{border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.sec .sh{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 14px;background:var(--paper);font-weight:700}
.sec .sh .sc{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.sec ul{list-style:none;margin:0;padding:6px 14px 12px;display:grid;gap:6px}
.sec li{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;font-size:.95rem}
.mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;margin-top:1px}
.mark.y{background:var(--ok);color:var(--sheet)}
.mark.n{background:var(--bad);color:var(--sheet)}
.tip{display:block;font-size:.86rem;color:var(--muted)}
.total{display:flex;align-items:baseline;gap:10px;font-family:var(--f-display)}
.total b{font-size:2.2rem;font-weight:800}

/* order */
.ordergrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.pool,.seq{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.pool h4,.seq h4{margin:0 0 2px;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stepc{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;border:1.5px solid var(--line);background:var(--sheet);border-radius:9px;padding:8px 10px;text-align:left;font-size:.93rem;min-height:44px}
.stepc .no{font-family:var(--f-display);font-weight:800;color:var(--blue)}
.stepc .mv{display:flex;gap:4px}
.stepc .mv button{border:1.5px solid var(--line);background:var(--sheet);border-radius:6px;width:32px;height:32px;display:grid;place-items:center;font-weight:800}
.stepc.right{border-color:var(--ok);background:var(--ok-soft)}
.stepc.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mat{border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.88rem;font-weight:700;min-height:104px}
.mat svg{width:34px;height:34px}
.mat[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.mat.right{border-color:var(--ok);background:var(--ok-soft)}
.mat.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* film */
.player{border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--sheet)}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;background:linear-gradient(180deg,var(--stage) 0 68%,var(--stage2) 68% 100%);overflow:hidden}
.stage .fig{position:absolute;bottom:8%;width:22%;transition:transform .4s}
.stage .fig.s{left:10%}
.stage .fig.c{right:10%}
.stage .fig.talk{animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3%)}}
.stage .tag{position:absolute;bottom:2%;font-size:.75rem;font-weight:700;background:var(--sheet);border:1.5px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.stage .tag.s{left:12%}
.stage .tag.c{right:12%}
.stage .bubble{position:absolute;top:7%;max-width:44%;background:var(--sheet);border:1.5px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:clamp(.78rem,1.8vw,1rem);font-weight:700;line-height:1.3}
.stage .bubble.s{left:6%}
.stage .bubble.c{right:6%}
.stage .actcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34%;background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:clamp(.7rem,1.5vw,.9rem)}
.stage .actcard svg{width:clamp(28px,6vw,48px);height:clamp(28px,6vw,48px);color:var(--ink)}
.stage .flash{position:absolute;inset:0;border:6px solid var(--coral);pointer-events:none;opacity:0;transition:opacity .2s}
.stage .flash.on{opacity:1}
.stage .fig svg{width:100%;height:auto;display:block}
.stage .playcover{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 45%,transparent);cursor:pointer}
.stage .playcover span{background:var(--sheet);color:var(--ink);border-radius:999px;padding:12px 22px;font-weight:800;font-family:var(--f-display)}
.subs{padding:10px 14px;min-height:3.2em;border-top:1.5px solid var(--line);font-size:.95rem}
.ctrl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1.5px solid var(--line);flex-wrap:wrap}
.bar{flex:1;min-width:140px;height:10px;background:var(--line);border-radius:5px;position:relative;cursor:pointer}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:5px}
.bar .flag{position:absolute;top:-4px;width:4px;height:18px;background:var(--coral);border-radius:2px}
.time{font-variant-numeric:tabular-nums;font-size:.88rem;color:var(--muted)}
.scorepick{display:flex;gap:8px;flex-wrap:wrap}
.scorepick button{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;font-weight:700}
.scorepick button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.errlist{display:grid;gap:6px;list-style:none;padding:0;margin:0}
.errlist li{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:.93rem}
video{width:100%;border-radius:10px;background:#000}
.kw{width:100%;border-collapse:collapse;font-size:.92rem}
.kw th,.kw td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.kw td.c{text-align:center;width:64px}
.kw input{width:18px;height:18px}
.tablewrap{overflow-x:auto}
.restab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.restab th,.restab td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left}
.restab td.r,.restab th.r{text-align:right}
.restab tfoot td{font-weight:800;font-family:var(--f-display);font-size:1.1rem;border-bottom:0}
.note{font-size:.82rem;color:var(--muted);max-width:75ch}
.inline-confirm{border:1.5px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.disp{display:flex;margin-top:6px}
.disp[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.facet{gap:14px}
.qq{font-weight:700}
.mcl{display:grid;gap:6px}
.mco{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}
.mco input{width:18px;height:18px}
.mco.right{background:var(--ok-soft)}.mco.wrong{background:var(--bad-soft)}
.mx,.qtab{border-collapse:collapse;font-size:.95rem;min-width:100%}
.mx th,.mx td,.qtab th,.qtab td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:middle}
.mx th{font-size:.85rem;text-align:center}
.mx td.c{text-align:center;width:96px;white-space:nowrap}
.mx td.c input{width:18px;height:18px}
.mx td.c .ok{color:var(--ok);font-weight:800;margin-left:4px}
.mx tr.right td:first-child{background:var(--ok-soft)}.mx tr.wrong td:first-child{background:var(--bad-soft)}
.qtab caption{font-weight:700;text-align:left;padding-bottom:6px}
.qtab thead th{background:var(--blue-soft)}
.mt{display:grid;gap:8px}
.mtr{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.mtr .tip{grid-column:2}
.mtr.right{background:var(--ok-soft)}.mtr.wrong{background:var(--bad-soft)}
@media (max-width:560px){.mtr{grid-template-columns:1fr}.mtr .tip{grid-column:1}.mx td.c{width:64px}}
.guide{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:10px;padding:10px 14px;border:1.5px solid var(--line);background:var(--sheet)}
.guide svg{width:22px;height:22px;flex:none}
.guide .gk{font-family:var(--f-display);font-weight:800;white-space:nowrap}

    notumble:S(sq+'<circle cx="24" cy="24" r="12"/>'+cross,'niet in de droogtrommel'),

  };
  return map[code]||'';
}

  /* ---------- OPDRACHT 2: uitnodiging ---------- */
  doc:{
    kind:'a4', title:'Een uitnodiging maken', file:'uitnodiging_jouw naam', prog:'Word',
    text:'Binnenkort vindt Beweegfestival Vitaal plaats. Jij maakt de uitnodiging op een A4-pagina. Gebruik het bestand vb_informatie (knop hieronder). Je mag informatie kopiëren en plakken.',
    inhoudTxt:[
      ['koptekst','vier afbeeldingen met dezelfde hoogte naast elkaar. Op de afbeeldingen staan: sportschoenen, fruit, een waterfles en een fiets'],
      ['bovenaan','de titel: Uitnodiging Beweegfestival Vitaal'],
      ['bovenaan','twee uitnodigende zinnen waarin je mensen enthousiast maakt om naar het festival te komen'],
      ['middenin','het kopje ‘Activiteiten Beweegfestival’, drie activiteiten met toelichting, en de dansworkshops'],
      ['onderaan','een tabel van twee kolommen en vier rijen. Voeg de eerste rij samen. In de eerste rij staat het kopje: Tijdschema theatervoorstellingen. In rij 2, 3 en 4 staan in kolom 1 de tijden en in kolom 2 de namen van de theatervoorstellingen'],
      ['onder de tabel','jouw naam en kandidaatnummer'],
      ['voettekst','de gegevens van het festival']],
    layoutTxt:[
      ['titel','lettertype Comic Sans MS · tekengrootte 24 · groene tekstkleur · gecentreerd'],
      ['uitnodigende zinnen','cursief'],
      ['dansworkshops','gebruik nummering'],
      ['alle tekst behalve titel, tabel en voettekst','lettertype Verdana · tekengrootte 12 · blauwe tekstkleur'],
      ['tabel (alle rijen)','lettertype Comic Sans MS · tekengrootte 12 · groene tekstkleur'],
      ['tabel rij 1','arceer de cel lichtblauw'],
      ['tabel rij 2, 3 en 4','tijden en voorstellingen rechts uitgelijnd'],
      ['onder de tabel','onderstreep je naam en kandidaatnummer'],
      ['voettekst','tekst is vet'],
      ['','de uitnodiging past op één zijde van een A4']],
    info:`<h4>vb_informatie</h4>
      <p><b>Gegevens festival</b><br>Beweegfestival Vitaal · Sportpark Kruithuis · Kruithuisweg 12, 2611 RK Delft · telefoon 015-214 00 90 · www.beweegfestivalvitaal.nl</p>
      <p><b>Over het festival</b><br>Het festival is op zaterdag 13 juni van 9.00 tot 17.00 uur. Kom ook naar het Beweegfestival Vitaal en ontdek hoe leuk bewegen is! Neem je vrienden en familie mee: er is voor iedereen iets te doen! Parkeren bij het sportpark kost € 5,-.</p>
      <p><b>Activiteiten</b><br>Bootcamp voor beginners – In een uur leer je met eenvoudige oefeningen sterker en fitter te worden.<br>Kinder-EHBO – Ouders leren wat ze moeten doen als hun kind zich bezeert.<br>Smoothies maken – Maak je eigen gezonde smoothie met fruit en groente.</p>
      <p><b>Dansworkshops</b><br>Zumba<br>Streetdance<br>Linedance</p>
      <p><b>Theatervoorstellingen in de grote tent</b><br>11.00 uur – De Fitte Familie<br>13.30 uur – Suiker de Baas<br>15.30 uur – Slaap Lekker!</p>
      <p><b>Workshops</b> (niet in de uitnodiging): bootcamp om 10.00 uur en om 14.00 uur.</p>
      <p><b>Sponsor</b><br>Sportschool FitLife · Markt 3, 2611 GS Delft · 015-212 34 56</p>`,
    styles:[
      {id:'koptekst', l:'Koptekst (afbeeldingen)', props:['imgh']},
      {id:'titel', l:'Titel', props:['font','size','color','b','i','u','align']},
      {id:'zinnen', l:'Uitnodigende zinnen', props:['b','i','u','align']},
      {id:'tekst', l:'Overige tekst', props:['font','size','color','b','i','u']},
      {id:'dans', l:'Dansworkshops', props:['list','b','i','u']},
      {id:'tabel', l:'Tabel', props:['font','size','color','b','shade','align']},
      {id:'naam', l:'Naam onder de tabel', props:['b','i','u','align']},
      {id:'voet', l:'Voettekst', props:['b','i','u','align']}
    ],
    styleHelp:{tabel:'Arcering geldt voor rij 1. Uitlijning geldt voor rij 2, 3 en 4.'},
    controls:[
      {sec:'Koptekst', items:[
        {t:'pick', k:'imgs', l:'Kies de vier afbeeldingen voor de koptekst', n:4, opts:[
          {id:'schoen',l:'sportschoenen',emo:'👟'},{id:'fruit',l:'fruit',emo:'🍎'},{id:'water',l:'waterfles',emo:'💧'},{id:'fiets',l:'fiets',emo:'🚲'},
          {id:'patat',l:'patat',emo:'🍟'},{id:'game',l:'gamecontroller',emo:'🎮'},{id:'auto',l:'auto',emo:'🚗'},{id:'taart',l:'taart',emo:'🍰'}]}]},
      {sec:'Bovenaan', items:[
        {t:'text', k:'title', l:'Titel', ph:'Typ de titel'},
        {t:'pick', k:'zinnen', l:'Kies twee uitnodigende zinnen', n:2, opts:[
          {id:'z1',l:'Kom ook naar het Beweegfestival Vitaal en ontdek hoe leuk bewegen is!'},
          {id:'z2',l:'Neem je vrienden en familie mee: er is voor iedereen iets te doen!'},
          {id:'z3',l:'Het festival is op zaterdag 13 juni van 9.00 tot 17.00 uur.'},
          {id:'z4',l:'Parkeren bij het sportpark kost € 5,-.'}]}]},
      {sec:'Middenin', items:[
        {t:'text', k:'kopje', l:'Kopje', ph:'Typ het kopje'},
        {t:'pick', k:'act', l:'Kies drie activiteiten met toelichting', n:3, opts:[
          {id:'a1',l:'Bootcamp voor beginners – In een uur leer je met eenvoudige oefeningen sterker en fitter te worden.'},
          {id:'a2',l:'Kinder-EHBO – Ouders leren wat ze moeten doen als hun kind zich bezeert.'},
          {id:'a3',l:'Smoothies maken – Maak je eigen gezonde smoothie met fruit en groente.'},
          {id:'a4',l:'Bootcamp'},
          {id:'a5',l:'Sportschool FitLife – Markt 3, Delft.'}]},
        {t:'note', l:'De dansworkshops (Zumba, Streetdance, Linedance) staan al in je document, onder de activiteiten.'}]},
      {sec:'Onderaan: tabel', items:[
        {t:'sel', k:'dim', l:'Tabel invoegen', opts:['— kies —','2 kolommen × 4 rijen','4 kolommen × 2 rijen','3 kolommen × 4 rijen','2 kolommen × 3 rijen']},
        {t:'check', k:'merge', l:'Cellen van rij 1 samenvoegen'},
        {t:'text', k:'tkop', l:'Kopje in rij 1', ph:'Typ het kopje'},
        {t:'rows', k:'trows', l:'Rij 2, 3 en 4', n:3, cols:[
          {h:'kolom 1', opts:['— tijd —','10.00 uur','11.00 uur','13.30 uur','14.00 uur','15.30 uur']},
          {h:'kolom 2', opts:['— voorstelling —','De Fitte Familie','Suiker de Baas','Slaap Lekker!','Bootcamp voor beginners']}]},
        {t:'text', k:'naam', l:'Onder de tabel', ph:'Jouw naam en kandidaatnummer'}]},
      {sec:'Voettekst', items:[
        {t:'one', k:'voet', l:'Welke gegevens zet je in de voettekst?', opts:[
          {id:'v1',l:'Beweegfestival Vitaal · Sportpark Kruithuis · Kruithuisweg 12, 2611 RK Delft · 015-214 00 90 · www.beweegfestivalvitaal.nl'},
          {id:'v2',l:'Sportschool FitLife · Markt 3, 2611 GS Delft · 015-212 34 56'},
          {id:'v3',l:'Beweegfestival Vitaal · zaterdag 13 juni · 9.00 – 17.00 uur'}]}]}
    ],
    render:(d)=>{
      const v=d.v, imgs=(v.imgs||[]), opts=CASE_A.doc.controls[0].items[0].opts;
      const zin=CASE_A.doc.controls[1].items[1].opts, act=CASE_A.doc.controls[2].items[1].opts, voet=CASE_A.doc.controls[4].items[0].opts;
      const dims=(v.dim||'').match(/(\d) kolom\w* × (\d) rij/); const nc=dims?+dims[1]:0, nr=dims?+dims[2]:0;
      const ts=d.st.tabel, rowsV=v.trows||[];
      let tbl='';
      if(nc&&nr){
        const cell=(r,c)=>{ if(r===0) return c===0?esc(v.tkop||''):''; const rv=rowsV[r-1]||[]; const val=rv[c]; return val&&!val.startsWith('—')?esc(val):''; };
        tbl=`<table class="dtab" data-g="tabel" style="${stTxt(ts)}">`+[...Array(nr)].map((_,r)=>`<tr>${r===0&&v.merge?`<td colspan="${nc}" style="background:${SHADES[ts.shade]};text-align:left">${cell(0,0)}</td>`:[...Array(nc)].map((_,c)=>`<td style="${r===0?'text-align:left;background:'+SHADES[ts.shade]:'text-align:'+ALIGNS[ts.align]}">${cell(r,c)}</td>`).join('')}</tr>`).join('')+`</table>`;
      } else tbl=`<p class="ph" data-g="tabel">[tabel]</p>`;
      return `<div class="hdr" data-g="koptekst">${imgs.length?imgs.map((id,i)=>{const o=opts.find(x=>x.id===id); return `<span class="dimg" style="font-size:calc(${d.st.koptekst.imgh?40:[32,48,40,26][i%4]}*var(--u))">${o.emo}</span>`;}).join(''):'<span class="ph">[koptekst: afbeeldingen]</span>'}</div>
        <p data-g="titel" style="${stTxt(d.st.titel)}">${esc(v.title||'')||'<span class=ph>[titel]</span>'}</p>
        <div data-g="zinnen" style="${stTxt(d.st.tekst)}${stDeco(d.st.zinnen)}">${(v.zinnen||[]).map(id=>`<p>${esc(zin.find(x=>x.id===id).l)}</p>`).join('')||'<p class=ph>[uitnodigende zinnen]</p>'}</div>
        <div data-g="tekst" style="${stTxt(d.st.tekst)}">
          <p><b>${esc(v.kopje||'')||'<span class=ph>[kopje]</span>'}</b></p>
          ${(v.act||[]).map(id=>`<p>${esc(act.find(x=>x.id===id).l)}</p>`).join('')||'<p class=ph>[activiteiten]</p>'}
          <p>Dansworkshops:</p>
          <div data-g="dans" style="${stDeco(d.st.dans)}">${listHTML(['Zumba','Streetdance','Linedance'],d.st.dans.list)}</div>
        </div>
        ${tbl}
        <p data-g="naam" style="${stTxt(d.st.tekst)}${stDeco(d.st.naam)}">${esc(v.naam||'')||'<span class=ph>[naam en kandidaatnummer]</span>'}</p>
        <div class="foot" data-g="voet" style="${stDeco(d.st.voet)}">${v.voet?esc(voet.find(x=>x.id===v.voet).l):'<span class=ph>[voettekst]</span>'}</div>`;
    },
    inhoud:[
      {l:'koptekst: vier juiste afbeeldingen met dezelfde hoogte naast elkaar', ok:d=>sameSet(d.v.imgs,['schoen','fruit','water','fiets'])&&d.st.koptekst.imgh, tip:'Kies sportschoenen, fruit, waterfles en fiets, en zet ze even hoog.'},
      {l:'bovenaan: de titel ‘Uitnodiging Beweegfestival Vitaal’', ok:d=>norm(d.v.title)==='uitnodiging beweegfestival vitaal', tip:'Typ de titel precies zoals in de opdracht.'},
      {l:'bovenaan: twee uitnodigende zinnen', ok:d=>sameSet(d.v.zinnen,['z1','z2']), tip:'Uitnodigend = mensen enthousiast maken. Een openingstijd of parkeerprijs is geen uitnodigende zin.'},
      {l:'middenin: het kopje ‘Activiteiten Beweegfestival’ en drie juiste activiteiten met toelichting', ok:d=>norm(d.v.kopje)==='activiteiten beweegfestival'&&sameSet(d.v.act,['a1','a2','a3']), tip:'Elke activiteit heeft een toelichting. ‘Bootcamp’ alleen is te kort.'},
      {l:'onderaan: tabel juist gemaakt (2 × 4, rij 1 samengevoegd, kopje) en voorstellingen juist ingevuld', ok:d=>{const v=d.v; const want=[['11.00 uur','De Fitte Familie'],['13.30 uur','Suiker de Baas'],['15.30 uur','Slaap Lekker!']]; return v.dim==='2 kolommen × 4 rijen'&&v.merge&&norm(v.tkop)==='tijdschema theatervoorstellingen'&&want.every(w=>(v.trows||[]).some(r=>r&&r[0]===w[0]&&r[1]===w[1]));}, tip:'Bekijk in vb_informatie welke tijd bij welke voorstelling hoort. Workshops horen niet in de tabel.'},
      {l:'onder de tabel: naam en kandidaatnummer', ok:d=>/[a-z]/i.test(d.v.naam||'')&&/\d/.test(d.v.naam||''), tip:'Typ je naam én je kandidaatnummer.'},
      {l:'voettekst: de juiste gegevens van het festival', ok:d=>d.v.voet==='v1', tip:'De voettekst bevat naam, adres, telefoon en website van het festival, niet van de sponsor.'}
    ],
    layout:[
      {l:'titel: Comic Sans MS, 24, groen, gecentreerd', ok:d=>isSt(d.st.titel,{font:'Comic Sans MS',size:24,color:'groen',align:'midden'}), tip:'Klik op de titel en stel alle vier de dingen in.'},
      {l:'uitnodigende zinnen: cursief', ok:d=>d.st.zinnen.i},
      {l:'dansworkshops: nummering', ok:d=>d.st.dans.list==='nummering'},
      {l:'overige tekst: Verdana, 12, blauw', ok:d=>isSt(d.st.tekst,{font:'Verdana',size:12,color:'blauw'})},
      {l:'tabel: Comic Sans MS, 12, groen', ok:d=>isSt(d.st.tabel,{font:'Comic Sans MS',size:12,color:'groen'})},
      {l:'tabel rij 1: lichtblauw gearceerd', ok:d=>d.st.tabel.shade==='lichtblauw'},
      {l:'tabel rij 2, 3 en 4: rechts uitgelijnd', ok:d=>d.st.tabel.align==='rechts'},
      {l:'onder de tabel: naam en kandidaatnummer onderstreept', ok:d=>d.st.naam.u},
      {l:'voettekst: vet', ok:d=>d.st.voet.b},
      {l:'de uitnodiging past op één zijde van een A4', ok:d=>d.fits!==false, tip:'Maak de letters of afbeeldingen kleiner.'}
    ],
    pts:{inhoud:4, layout:4}
  },

      const desc=(list,id,num)=>{ const o=list.find(x=>x.id===id); if(!o) return '<p class="ph">[omschrijving]</p>'; return `<p>${esc(o.l)}</p>${o.ex?`<p>Voorbeelden:</p>${listHTML(o.ex,num?'nummering':'opsommingstekens')}`:''}`; };

      const two=(k,dk,list,ik,pk,num)=>{ const pos=v[pk]||'rechts'; const text=`<div data-g="oms" style="${O}">${desc(list,v[dk],num)}</div>`; const pic=`<div class="spic">${img(v[ik])}</div>`;

        `${ttl('t1',0)}<div class="spic big">${img(v.i1)}</div>`,

/* chat helpers (ook gebruikt in de data) */
function did(st,id){ return st.done[id]!==undefined; }
function before(st,a,b){ return did(st,a) && (!did(st,b) || st.done[a]<st.done[b]); }
function uForm(st){ return st.uCount>0 && st.jeCount===0 && !st.flags.rude; }
function fact(st,id){ return !!(st.facts&&st.facts[id]); }
function routeOk(st){ const s=(st.routeSeq||[]).join(''); return !!st.routeRec && /L.*R.*L/.test(s); }
function dayItems(d,n){
  const asg=d.v.asg||{}; const items=[{id:'base',t:C_BASE,extra:false}, ...C_EXTRA.filter(e=>asg[e.id]===n).map(e=>({id:e.id,t:e.t,extra:true}))];
  const ord=(d.v.ord||{})[n]||[];
  return items.sort((a,b)=>{ const ia=ord.indexOf(a.id), ib=ord.indexOf(b.id); return (ia<0?99:ia)-(ib<0?99:ib); });
}

/* scoring van beoordelingssecties */
function scoreSection(sec, st){
  const res=sec.items.map(it=>({l:it.l, tip:it.tip, ok:!!it.ok(st)}));
  const n=res.filter(r=>r.ok).length, wrong=res.length-n;
  let pts=0;
  if(sec.mode==='minus') pts=Math.max(0, sec.max-wrong);
  else if(sec.mode==='all') pts= wrong===0?sec.max:0;
  else { for(const [min,p] of sec.bands){ if(n>=min){pts=p;break;} } }
  return {code:sec.code,title:sec.title,max:sec.max,pts,items:res};
}
function secHTML(s,extra){
  return `<div class="sec"><div class="sh"><span>${s.code} · ${esc(s.title)}</span><span class="sc">${s.pts}/${s.max}</span></div>
    <ul>${s.items.map((i,ix)=>`<li><span class="mark ${i.ok?'y':'n'}">${i.ok?'✓':'✗'}</span><span>${esc(i.l)}${!i.ok&&i.tip?`<span class="tip">Tip: ${esc(i.tip)}</span>`:''}${extra?extra(s,i,ix):''}</span></li>`).join('')}</ul></div>`;
}

function prepQ(q){
  if(q.t==='mc') return shufQ(q);
  if(q.t==='matrix') return {...q, rows:shuffle(q.rows)};
  if(q.t==='match') return {...q, items:shuffle(q.items)};
  return q;
}
function qRight(q,ans){
  if(ans===undefined) return false;
  if(q.t==='mc') return ans===q.a;
  if(q.t==='matrix') return q.rows.every((r,i)=>ans[i]===r.a);
  if(q.t==='match') return q.items.every((it,i)=>ans[i]===it.a);
  return false;
}
function qComplete(q,ans){
  if(ans===undefined) return false;
  if(q.t==='mc') return true;
  const n=q.t==='matrix'?q.rows.length:q.items.length;
  return Array.isArray(ans) && ans.length===n && ans.every(v=>v!==undefined&&v!==null);
}
function tableHTML(t){ return t?`<div class="tablewrap"><table class="qtab"><caption>${esc(t.title)}</caption><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''; }
function qBody(q,ans,review,k=0){
  let h=(q.table?tableHTML(q.table):'')+(q.care?careRow(q.care):'')+(q.ctx?`<p>${esc(q.ctx)}</p>`:'')+`<p class="qq">${esc(q.q)}</p>`;
  if(q.t==='mc'){
    h+=`<div class="mcl">${q.o.map((o,j)=>{const cls=review?(j===q.a?'right':(j===ans?'wrong':'')):''; return `<label class="mco ${cls}"><input type="radio" name="mc${k}" data-mc="${j}" ${ans===j?'checked':''} ${review?'disabled':''}><span>${esc(o)}</span></label>`;}).join('')}</div>`;
  } else if(q.t==='matrix'){
    h+=`<div class="tablewrap"><table class="mx"><thead><tr><th></th>${q.cols.map(cn=>`<th>${esc(cn)}</th>`).join('')}</tr></thead><tbody>${q.rows.map((r,i)=>`<tr class="${review?(ans&&ans[i]===r.a?'right':'wrong'):''}"><td>${r.care?`<span class="inl">${careRow(r.care)}</span>`:''}${esc(r.s)}</td>${q.cols.map((_,j)=>`<td class="c"><input type="radio" name="mx${k}_${i}" data-mx="${i}:${j}" aria-label="${esc(r.s)}: ${esc(q.cols[j])}" ${ans&&ans[i]===j?'checked':''} ${review?'disabled':''}>${review&&j===r.a?'<span class="ok">✓</span>':''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  } else if(q.t==='match'){
    h+=`<div class="mt">${q.items.map((it,i)=>`<div class="mtr ${review?(ans&&ans[i]===it.a?'right':'wrong'):''}"><b>${it.care?careRow([it.care]):esc(it.l)}</b><select data-mt="${i}" aria-label="${it.care?'symbool '+(i+1):esc(it.l)}" ${review?'disabled':''}><option value="">kies …</option>${q.o.map((o,j)=>`<option value="${j}" ${ans&&ans[i]===j?'selected':''}>${esc(o)}</option>`).join('')}</select>${review&&!(ans&&ans[i]===it.a)?`<span class="tip">Goed: ${esc(q.o[it.a])}</span>`:''}</div>`).join('')}</div>`;
  }
  return h;
}
function qzView(c,cfg){
  const key=cfg.key;
  if(runtime[key] && runtime[key].lv!==S.level && cfg.byLevel) runtime[key]=null;
  const rt = runtime[key] ||= {i:0, ans:[], done:false, lv:S.level, set:cfg.set().map(prepQ)};
  const r=R(c.id)[cfg.save];
  if(rt.done || (r && r.set && (!cfg.byLevel||r.lv===S.level) && !rt.retry && rt.ans.length===0)){
    const ans = rt.done? rt.ans : r.ans; const set = rt.done? rt.set : r.set;
    const score = set.filter((q,i)=>qRight(q,ans[i])).length;
    return `<div class="opd">${opdHead(cfg.nr,cfg.max)}<div class="content">
      <h2>${esc(cfg.title)} — uitslag</h2>
      <div class="total"><b>${score}</b><span>van ${set.length} punten</span></div>
      ${set.map((q,i)=>`<div class="q card"><div class="qhead"><span class="eyebrow">Vraag ${i+1} · 1p</span><span class="chip ${qRight(q,ans[i])?'done':'bad'}">${qRight(q,ans[i])?'goed':'fout'}</span></div>${qBody(q,ans[i],true,i)}<p class="expl">${esc(q.e)}</p></div>`).join('')}
      <p class="small muted">Net als in Facet krijg je bij een vraag met meer regels alleen het punt als alle regels goed zijn.</p>
      <div class="row"><button class="btn ghost" id="q-retry">Opnieuw maken</button><button class="btn primary" data-go="${cfg.next}">${cfg.next==='res'?'Naar de uitslag':'Naar opdracht '+cfg.next.slice(1)}</button></div>
    </div></div>`;
  }
  const q=rt.set[rt.i], a=rt.ans[rt.i];
  return `<div class="opd">${opdHead(cfg.nr,cfg.max)}<div class="content">
    <h2>${esc(cfg.title)}</h2>
    ${cfg.intro&&rt.i===0?`<div class="boekje"><p>${esc(cfg.intro)}</p></div>`:''}
    <div class="q card facet">
      <div class="qhead"><span class="eyebrow">Vraag ${rt.i+1} van ${rt.set.length} · 1p</span><span class="dots">${rt.set.map((_,i)=>`<i class="${i<=rt.i?'on':''}"></i>`).join('')}</span></div>
      ${qBody(q,a,false,rt.i)}
      <div class="row" style="justify-content:space-between">
        <button class="btn ghost sm" id="q-prev" ${rt.i===0?'disabled':''}>Vorige</button>
        <button class="btn primary" id="q-next" ${qComplete(q,a)?'':'disabled'}>${rt.i===rt.set.length-1?'Inleveren':'Volgende'}</button>
      </div>
    </div>
  </div></div>`;
}
function qzBind(c,cfg){
  const rt=runtime[cfg.key]; bindIntro();
  const q=rt.set&&rt.set[rt.i];
  const upd=()=>{ const n=$('#q-next'); if(n) n.disabled=!qComplete(q,rt.ans[rt.i]); };
  document.querySelectorAll('[data-mc]').forEach(b=>b.onchange=()=>{ rt.ans[rt.i]=+b.dataset.mc; upd(); });
  document.querySelectorAll('[data-mx]').forEach(b=>b.onchange=()=>{ const [i,j]=b.dataset.mx.split(':').map(Number); const arr=(rt.ans[rt.i] ||= Array(q.rows.length).fill(undefined)); arr[i]=j; upd(); });
  document.querySelectorAll('[data-mt]').forEach(b=>b.onchange=()=>{ const i=+b.dataset.mt; const arr=(rt.ans[rt.i] ||= Array(q.items.length).fill(undefined)); arr[i]=b.value===''?undefined:+b.value; upd(); });
  const n=$('#q-next'); if(n) n.onclick=()=>{ if(rt.i<rt.set.length-1){rt.i++; render();} else { rt.done=true; const score=rt.set.filter((qq,i)=>qRight(qq,rt.ans[i])).length; R(c.id)[cfg.save]={score,ans:rt.ans.slice(),set:rt.set,lv:S.level,max:rt.set.length}; save(); render(); window.scrollTo(0,0);} };
  const p=$('#q-prev'); if(p) p.onclick=()=>{rt.i--; render();};
  const rr=$('#q-retry'); if(rr) rr.onclick=()=>{ runtime[cfg.key]={i:0,ans:[],done:false,retry:true,lv:S.level,set:shuffle(cfg.set()).map(prepQ)}; render(); };
}

function previewHTML(c,d){
  const inner=c.doc.render(d);
  if(c.doc.kind==='slides') return `<div class="slides" id="page">${inner}</div>`;
  return `<div class="pagewrap"><div class="page a4" id="page"><div class="pin" id="pin">${inner}</div></div><p class="chip bad fitwarn" id="fitwarn" hidden>Past niet op één A4</p></div>`;
}
function postPreview(c,d){
  document.querySelectorAll('#page [data-g]').forEach(el=>{ el.classList.toggle('selg', el.dataset.g===d.sel); });
  if(c.doc.kind!=='slides'){ const pg=$('#page'), pin=$('#pin'); if(pg&&pin){ const cs=getComputedStyle(pg); const avail=pg.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom); d.fits = pin.scrollHeight<=avail+1; const w=$('#fitwarn'); if(w) w.hidden=d.fits; } }
}
function refreshPreview(c,d){ const p=$('#preview'); if(p){ p.innerHTML=previewHTML(c,d); postPreview(c,d); bindPreviewClicks(c,d); } }
function bindPreviewClicks(c,d){ document.querySelectorAll('#page [data-g]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); if(!c.doc.styles.some(g=>g.id===el.dataset.g)) return; d.sel=el.dataset.g; rerenderDoc(); }); }
function rerenderDoc(){ const y=window.scrollY; render(); window.scrollTo(0,y); }

function docScore(c,d,okFn){
  const doc=c.doc;
  const mk=(code,title,max,list)=>{ const items=list.map((it,ix)=>({l:it.l,tip:it.tip,ok:!!okFn(it,ix,code)})); const wrong=items.filter(i=>!i.ok).length; return {code,title,max,pts:Math.max(0,max-wrong),items}; };
  return [mk('B2a','inhoud',doc.pts.inhoud,doc.inhoud), mk('B2b','lay-out',doc.pts.layout,doc.layout)];
}
function docView(c){
  const d = runtime.doc ||= newDoc(c), doc=c.doc;
  const head=`<div class="row" style="justify-content:space-between"><h2>${esc(doc.title)}</h2>
    <div class="seg" role="group" aria-label="Werkwijze"><button data-dmode="app" aria-pressed="${d.mode==='app'}">Maken in de app</button><button data-dmode="self" aria-pressed="${d.mode==='self'}">Ik maak het in ${esc(doc.prog)}</button></div></div>`;
  const info=`<details class="infofile" ${d.infoOpen?'open':''}><summary>📄 vb_informatie openen</summary><div class="infotext">${doc.info}</div></details>`;
  if(d.phase==='done'){
    const secs=d.secs, score=secs.reduce((a,s)=>a+s.pts,0);
    return `<div class="opd">${opdHead(2,8)}<div class="content assess">
      <h2>${esc(doc.title)} — beoordeling</h2>
      <div class="total"><b>${score}</b><span>van 8 punten</span></div>
      ${d.mode==='self'?`<p class="chip warn" style="align-self:flex-start">Zelfbeoordeling: je hebt je werk in ${esc(doc.prog)} zelf nagekeken. Laat je docent meekijken.</p>`:''}
      ${secs.map(s=>secHTML(s)).join('')}
      ${d.mode==='app'?`<div class="card"><h3 style="margin-bottom:8px">Jouw ${doc.kind==='slides'?'presentatie':'document'}</h3><div id="preview" class="pvdone">${previewHTML(c,d)}</div></div>`:''}
      <div class="row"><button class="btn ghost" id="doc-edit">Verder werken</button><button class="btn ghost" id="doc-new">Opnieuw beginnen</button><button class="btn primary" data-go="o3">Naar opdracht 3</button></div>
    </div></div>`;
  }
  if(d.mode==='self'){
    const all=doc.inhoud.map((x,i)=>['B2a',i,x]).concat(doc.layout.map((x,i)=>['B2b',i,x]));
    return `<div class="opd">${opdHead(2,8)}<div class="content">${head}${boekjeDoc(c)}${info}
      <div class="card"><h3 style="margin-bottom:6px">Kijkwijzer: kijk je eigen bestand na</h3>
        <p class="small muted" style="margin-bottom:10px">Open je bestand in ${esc(doc.prog)} en vink alleen aan wat helemaal klopt.</p>
        ${['B2a','B2b'].map(code=>`<h4 class="kwh">${code} · ${code==='B2a'?'inhoud':'lay-out'}</h4>${all.filter(x=>x[0]===code).map(([cd,i,x])=>`<label class="check"><input type="checkbox" data-self="${cd}:${i}" ${d.self[cd+':'+i]?'checked':''}><span>${esc(x.l)}</span></label>`).join('')}`).join('')}
      </div>
      <div class="row"><button class="btn primary" id="self-save">Zelfbeoordeling opslaan</button></div>
    </div></div>`;
  }
  return `<div class="opd">${opdHead(2,8)}<div class="content">
    ${head}
    <details class="opdr" ${d.opdOpen===false?'':'open'}><summary>Opdracht (opdrachtenboekje)</summary>${boekjeDoc(c)}</details>
    ${info}
    <div class="docgrid">
      <div class="docctl">
        ${doc.controls.map(sec=>`<details class="agrp" ${d.open&&d.open[sec.sec]===false?'':'open'} data-sec="${esc(sec.sec)}"><summary><span>${esc(sec.sec)}</span></summary><div class="agrp-b">${sec.items.map(it=>ctrlHTML(it,d,c)).join('')}</div></details>`).join('')}
      </div>
      <div class="docpv">
        ${ribbonHTML(c,d)}
        <div id="preview">${previewHTML(c,d)}</div>
      </div>
    </div>
    <div class="row"><button class="btn primary" id="doc-submit">Opslaan en inleveren</button><span class="small muted">De app kijkt je ${doc.kind==='slides'?'presentatie':'document'} na zoals de examinator.</span></div>
  </div></div>`;
}
function bindDoc(c){
  const d=runtime.doc, doc=c.doc; bindIntro();
  document.querySelectorAll('[data-dmode]').forEach(b=>b.onclick=()=>{ d.mode=b.dataset.dmode; if(d.phase==='done') d.phase='work'; render(); });
  const inf=$('.infofile'); if(inf) inf.ontoggle=()=>{ d.infoOpen=inf.open; };
  const op=$('.opdr'); if(op) op.ontoggle=()=>{ d.opdOpen=op.open; };
  if(d.phase==='done'){
    if($('#preview')) postPreview(c,d);
    $('#doc-edit').onclick=()=>{ d.phase='work'; render(); };
    $('#doc-new').onclick=()=>{ runtime.doc=newDoc({...c, doc}); runtime.doc.v=JSON.parse(JSON.stringify(doc.init||{})); doc.styles.forEach(g=>runtime.doc.st[g.id]={...DEFSTYLE}); render(); };
    return;
  }
  if(d.mode==='self'){
    document.querySelectorAll('[data-self]').forEach(x=>x.onchange=()=>{ d.self[x.dataset.self]=x.checked; });
    $('#self-save').onclick=()=>{ d.secs=docScore(c,d,(it,ix,code)=>d.self[code+':'+ix]); const score=d.secs.reduce((a,s)=>a+s.pts,0);
      R(c.id).o2={score, self:true, secs:d.secs.map(s=>({code:s.code,pts:s.pts,max:s.max}))}; save(); d.phase='done'; render(); window.scrollTo(0,0); };
    return;
  }
  document.querySelectorAll('details.agrp[data-sec]').forEach(x=>x.ontoggle=()=>{ (d.open ||= {})[x.dataset.sec]=x.open; });
  postPreview(c,d); bindPreviewClicks(c,d);
  // inhoud
  document.querySelectorAll('[data-v]').forEach(i=>i.oninput=()=>{ d.v[i.dataset.v]=i.value; refreshPreview(c,d); });
  document.querySelectorAll('[data-sel]').forEach(i=>i.onchange=()=>{ d.v[i.dataset.sel]=i.value; rerenderDoc(); });
  document.querySelectorAll('[data-chk]').forEach(i=>i.onchange=()=>{ d.v[i.dataset.chk]=i.checked; rerenderDoc(); });
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ const [k,id]=b.dataset.pick.split(':'); const it=doc.controls.flatMap(s=>s.items).find(x=>x.k===k);
    let cur=(d.v[k]||[]).slice(); if(cur.includes(id)) cur=cur.filter(x=>x!==id); else { cur.push(id); if(cur.length>it.n) cur.shift(); } d.v[k]=cur; rerenderDoc(); });
  document.querySelectorAll('[data-one]').forEach(b=>b.onclick=()=>{ const [k,id]=b.dataset.one.split(':'); d.v[k]=d.v[k]===id?null:id; rerenderDoc(); });
  document.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>{ const [k,id]=b.dataset.img.split(':'); d.v[k]=d.v[k]===id?null:id; rerenderDoc(); });
  document.querySelectorAll('[data-row]').forEach(s=>s.onchange=()=>{ const [k,i,j]=s.dataset.row.split(':'); const rv=(d.v[k] ||= []); (rv[+i] ||= [])[+j]=s.value; rerenderDoc(); });
  document.querySelectorAll('[data-asg]').forEach(s=>s.onchange=()=>{ const id=s.dataset.asg; (d.v.asg ||= {})[id]=s.value.startsWith('—')?null:s.value;
    const ord=(d.v.ord ||= {}); Object.keys(ord).forEach(n=>ord[n]=ord[n].filter(x=>x!==id));
    if(d.v.asg[id]){ const n=d.v.asg[id]; const cur=dayItems(d,n).map(x=>x.id).filter(x=>x!==id); ord[n]=cur.concat(id); }
    rerenderDoc(); });
  const mv=(n,i,dir)=>{ const ids=dayItems(d,n).map(x=>x.id); const j=i+dir; if(j<0||j>=ids.length) return; [ids[i],ids[j]]=[ids[j],ids[i]]; (d.v.ord ||= {})[n]=ids; rerenderDoc(); };
  document.querySelectorAll('[data-ordup]').forEach(b=>b.onclick=()=>{ const [n,i]=b.dataset.ordup.split(':'); mv(n,+i,-1); });
  document.querySelectorAll('[data-orddn]').forEach(b=>b.onclick=()=>{ const [n,i]=b.dataset.orddn.split(':'); mv(n,+i,1); });
  // opmaak
  $('#tb-sel').onchange=e=>{ d.sel=e.target.value; rerenderDoc(); };
  const s=()=>d.st[d.sel];
  document.querySelectorAll('[data-tb]').forEach(x=>x.onchange=()=>{ const p=x.dataset.tb; s()[p]= p==='size'? +x.value : x.value; rerenderDoc(); });
  document.querySelectorAll('[data-tbt]').forEach(x=>x.onclick=()=>{ const p=x.dataset.tbt; s()[p]=!s()[p]; rerenderDoc(); });
  document.querySelectorAll('[data-tba]').forEach(x=>x.onclick=()=>{ s().align=x.dataset.tba; rerenderDoc(); });
  document.querySelectorAll('[data-tbc]').forEach(x=>x.onchange=()=>{ s()[x.dataset.tbc]=x.checked; rerenderDoc(); });
  $('#doc-submit').onclick=()=>{
    postPreview(c,d);
    d.secs=docScore(c,d,(it)=>it.ok(d)); const score=d.secs.reduce((a,s)=>a+s.pts,0);
    R(c.id).o2={score, secs:d.secs.map(s=>({code:s.code,pts:s.pts,max:s.max})), d:{v:d.v, st:d.st}}; save();
    d.phase='done'; render(); window.scrollTo(0,0);
  };
}

function aiSwitch(st){
  if(AI_STATE==='none') return '';
  const on=AI_STATE==='on';
  const msg= on ? (st.ai?'Je gesprekspartner praat natuurlijker; de beoordeling blijft hetzelfde.':'Zet aan voor een gesprekspartner die natuurlijker praat.')
    : AI_STATE==='checking' ? 'AI wordt gecontroleerd …'
    : (AI_WHY || 'Niet beschikbaar in deze weergave. Open de app in claude.ai terwijl je bent ingelogd. Het gesprek werkt nu met vaste zinnen.');
  return `<div class="aiswitch" style="flex-wrap:wrap"><label style="display:flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" id="ai-on" ${st.ai&&on?'checked':''} ${on?'':'disabled'}> Slimme gesprekspartner (AI)</label><span class="small muted">${esc(msg)}</span></div>`;
}

function newChat(c){

function prepTimer(st,min){
  const m=Math.floor(st.timeLeft/60), s=st.timeLeft%60;
  return `<div class="timer"><span class="clock" id="clock">${m}:${String(s).padStart(2,'0')}</span><span class="small muted">Je hebt ${min} minuten om je voor te bereiden.</span><button class="btn sm ghost" id="tstart">${st.timer?'Pauze':'Start voorbereidingstijd'}</button></div>`;
}
function bindTimer(st){
  const b=$('#tstart'); if(!b) return;
  b.onclick=()=>{
    if(st.timer){clearInterval(st.timer); st.timer=null; b.textContent='Verder';}
    else { st.timer=setInterval(()=>{ st.timeLeft=Math.max(0,st.timeLeft-1); const el=$('#clock'); if(el){const m=Math.floor(st.timeLeft/60),s=st.timeLeft%60; el.textContent=m+':'+String(s).padStart(2,'0');} if(st.timeLeft===0){clearInterval(st.timer); st.timer=null;} },1000); b.textContent='Pauze'; }
  };
}
/* voicemail afspelen: Claude-stem → browserstem → tekst */
async function playVoicemail(text, onState){
  if(TTS){ try{ onState('speaking'); await TTS.speak(text,{language:'nl',voice:'rounded'}); onState('idle'); return true; }catch(e){ onState('idle'); if(e&&e.code==='not_granted') TTS=null; } }
  if(window.speechSynthesis && window.SpeechSynthesisUtterance){
    try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='nl-NL'; u.rate=.95;
      const nl=speechSynthesis.getVoices().find(v=>/^nl/i.test(v.lang)); if(nl) u.voice=nl;
      onState('speaking'); u.onend=()=>onState('idle'); u.onerror=()=>onState('idle'); speechSynthesis.speak(u); return true; }catch(e){ onState('idle'); }
  }
  return false;
}

function nextGuide(ch,st){

function runBeat(c,st){
  for(const b of (c.talk.beats||[])){
    if(st.used[b.id]) continue;
    if(b.when(st)){ st.used[b.id]=1; if(b.fx) b.fx(st); return b.line; }
  }
  return null;
}
function markDone(st,id){ if(st.done[id]===undefined) st.done[id]=++st.seq; }
function doAction(c,st,id){
  st.lastAct=Date.now(); st.hintOn=false;
  const ch=c.talk, a=ch.actions.find(x=>x.id===id); if(!a) return;
  const key=a.as||a.id;
  if(a.req){ for(const r of a.req){ if(!did(st,r)){ pushLog(st,'a','Je wilt: '+a.label.toLowerCase()+'.'); pushLog(st,'n','Dat kan nog niet. Doe eerst iets anders.'); render(); scrollLog(); return; } } }
  if(did(st,key) && !a.repeat && !a.as){ pushLog(st,'n','Dat heb je al gedaan.'); render(); scrollLog(); return; }
  pushLog(st,'a', a.narr || a.label+'.');
  markDone(st,key); (st.usedAct ||= {})[a.id]=1;
  const lines=[];
  if(a.fx){ const f=a.fx(st); if(f) lines.push(f); }
  if(a.reply) lines.push(a.reply);
  const beat=runBeat(c,st); if(beat) lines.push(beat);
  lines.forEach(l=>{ const act=l.startsWith('*')&&l.endsWith('*')&&l.indexOf('*',1)===l.length-1; pushLog(st, act?'a':'c', act?l.slice(1,-1):l); });
  render(); scrollLog();
}

/* ---- taalherkenning ---- */
function lev(a,b){ if(Math.abs(a.length-b.length)>2) return 9; const m=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){ let prev=m[0]; m[0]=i; for(let j=1;j<=b.length;j++){ const tmp=m[j]; m[j]=Math.min(m[j]+1,m[j-1]+1,prev+(a[i-1]===b[j-1]?0:1)); prev=tmp; } } return m[b.length]; }
function fuzzy(t,words){ const toks=t.split(/[^a-zà-ÿ]+/).filter(Boolean);
  return words.some(w=>toks.some(k=> k===w || (w.length>=5&&k.startsWith(w)) || (w.length>=6&&lev(k,w)<=1) || (w.length>=9&&lev(k,w)<=2))); }
const GREET=['goedemiddag','goedemorgen','goedenavond','goedendag','hallo','hoi','hey','hee','hai','dag','hello'];
const EMP=['vervelend','begrijp','begrijpelijk','voorstellen','moeilijk','lastig','vreselijk','jammer','logisch','snap','snapt','balen','sneu','rot','excuses','sorry','spijt'];
const RX={
  greetFormal:/\bgoede(morgen|middag|avond|dag)\b/,
  intro:/\b(ik ben|mijn naam is|ik heet|u spreekt met|je spreekt met|ik loop (hier )?stage|de stagiai?re?)\b|^(goede\w*,? ?)?met [a-z]{2,}/,
  purposeVerb:/(kom|ga|gaan|wil|mag|zal|help|bel|kan ik|ik heb)/,
  askQ:/(heeft u (nog |misschien |verder )?(een |nog )?vra(ag|gen)|nog vragen\?|wilt u (nog )?iets vragen|zijn er (nog )?vragen|wilt u nog iets weten|is er nog iets wat u wilt (vragen|weten))/,
  bye:/(tot ziens|tot zo\b|doei|doeg|\bdaag\b|^dag\b|\bdag (meneer|mevrouw)|fijne (dag|middag|avond|vakantie|tijd|weekend)|prettige (dag|middag|avond|vakantie)|tot (straks|morgen|later|de volgende)|veel plezier|het beste|nog een fijne)/,
  empathyPh:/(wat naar|rot voor|kan me (dat )?(goed )?voorstellen|niet leuk|niet fijn|naar voor u|lijkt me|wat erg|vervelend voor u|ik snap|ik begrijp|excuses|sorry)/,
  rude:/\b(stom|dom|kut|shit|tering|kanker|godver\w*|sukkel|idioot|hou je kop|schiet op|zeur|boeie|boeien|irritant)\b/,
  doneTalk:/(dat was (het|alles)|meer (was|is) (het )?niet|dat is (het|alles)|verder (niks|niets))/
};
const GENERIC_QA=[
  {re:/(sorry|excuus|pardon)/, a:['Geeft niks, hoor.']},
  {re:/(momentje|moment|even wachten|ogenblik|even kijken|even opzoeken)/, a:['*wacht geduldig*','Neem je tijd.']},
  {re:/(dank u|bedankt|dankjewel|dank je)/, a:['Graag gedaan.','Ja hoor.']}
];
function pick(st,key,arr){ st.rot ||= {}; const i=st.rot[key]||0; st.rot[key]=i+1; return arr[i%arr.length]; }

function analyse(c,st,raw){
  const t=raw.toLowerCase().replace(/[’‘]/g,"'").replace(/\bgoe(?:de|ie|i)n? ?(morgen|middag|avond|dag)\b/g,'goede$1');
  const ch=c.talk, rx=ch.re||{};
  st.msgs++;
  const wc=t.split(/\s+/).filter(Boolean).length; st.words+=wc; st.wordsAvg=st.words/st.msgs;
  if(st.msgs<=3 && fuzzy(t,GREET)){ if(!st.said.greet) st.greetedNow=(t.match(/goede(morgen|middag|avond)/)||[])[1]||'hallo'; st.said.greet=1; }
  if(st.msgs<=3 && RX.greetFormal.test(t)) st.said.greetFormal=1;
  if(RX.intro.test(t)) st.said.intro=1;
  if(rx.purpose && rx.purpose.test(t) && RX.purposeVerb.test(t)) st.said.purpose=1;
  if(rx.interest && rx.interest.test(t)) st.said.interest=1;
  if(RX.askQ.test(t)) st.said.askQ=1;
  if(st.msgs>1 && RX.bye.test(t)) st.said.bye=1;
  if(st.concernAt>=0 && st.msgs<=st.concernAt+2 && (RX.empathyPh.test(t)||fuzzy(t,EMP))) st.empathyOk=true;
  if(RX.rude.test(t)) st.flags.rude=(st.flags.rude||0)+1;
  const uHits=(t.match(/\b(u|uw|alstublieft|dank u)\b/g)||[]).length;
  const cleaned=t.replace(/dank je( wel)?|bedankt|dankjewel/g,'');
  const jeHits=(cleaned.match(/\b(je|jij|jou|jouw)\b/g)||[]).length;
  st.uCount+=uHits; st.jeCount+=jeHits;
  // feiten die de leerling doorgeeft
  st.newFacts=0;
  (ch.facts||[]).forEach(f=>{
    if(st.facts[f.id]) return;
    if(f.digits){ if(t.replace(/\D/g,'').includes(f.digits)){ st.facts[f.id]=1; st.newFacts++; } return; }
    f.parts.forEach((re,k)=>{ if(re.test(t)) st.hit[f.id+k]=1; });
    if(f.parts.every((_,k)=>st.hit[f.id+k])){ st.facts[f.id]=1; st.newFacts++; }
  });
  return t;
}
function handleQuestions(c,st,t,lines){
  const ch=c.talk;
  // telefoon: één vraag na het doorgeven van de informatie
  if(ch.question){
    const q=ch.question, nf=Object.keys(st.facts).length;
    if(st.qAsked){
      if(/(even|moment|kijken|opzoeken|zoeken)/.test(t) && !/(zondag|zaterdag|vrijdag|\d)/.test(t)){ lines.push('*wacht geduldig*'); return; }
      st.qAsked=false; st.used.qDone=1; st.qAnswered=q.ok.every(re=>re.test(t)); lines.push(st.qAnswered?q.thanks:q.wrong); return;
    }
    if(!st.used.qDone && !st.used.q && (nf>=ch.facts.length || (nf>=q.after && RX.doneTalk.test(t)) || (nf>=q.after && st.msgs>=10))){ st.used.q=1; st.qAsked=true; lines.push(q.line); }
    return;
  }
  // kennismaking: twee vragen van de ouder
  if(ch.questions){
    if(st.qAsked){
      if(/(even|moment|kijken|opzoeken|zoeken)/.test(t) && t.split(/\s+/).length<8 && !(ch.questions[st.qIdx].ok.every(re=>re.test(t)))){ lines.push('*wacht geduldig*'); return; }
      const q=ch.questions[st.qIdx]; const ok=q.ok.every(re=>re.test(t)); st.qOk[st.qIdx]=ok; lines.push(ok?q.thanks:q.wrong); st.qIdx++; st.qAsked=false;
      if(st.qIdx<ch.questions.length){ lines.push(ch.questions[st.qIdx].line.replace(/^Ik heb twee vragen\. /,'')); st.qAsked=true; }
      else lines.push('Dat waren mijn vragen.');
      return;
    }
    if(st.qIdx===0 && (st.said.askQ || (fact(st,'lunch')&&fact(st,'act')&&st.msgs>=9) || st.msgs>=14)){
      if(!st.said.askQ) lines.push('Ik heb ook nog twee vragen.');
      lines.push(ch.questions[0].line); st.qAsked=true;
    }
  }
}

async function studentSays(c,st,raw){
  const ch=c.talk; st.lastAct=Date.now(); st.hintOn=false;
  pushLog(st,'s',raw);
  const t=analyse(c,st,raw);
  let lines=[];
  if(st.flags.rude && !st.used['rude'+st.flags.rude]){ st.used['rude'+st.flags.rude]=1; lines.push(pick(st,'rude',['Zo praat je toch niet tegen mij?','Dat vind ik niet zo netjes, hoor.'])); }
  if(st.greetedNow){ const w=st.greetedNow; st.greetedNow=null; if(!(ch.kind==='phone'&&st.msgs>1)) lines.push(w==='hallo'?'Hallo!':'Goede'+w+'!'); }
  if(ch.special) lines.push(...ch.special(st,t,ch));
  const before=lines.length;
  handleQuestions(c,st,t,lines);
  const asked=lines.length>before;
  if(!asked && st.newFacts>0) lines.push(pick(st,'fact',ch.factReply||['Oké.']));
  if(st.said.bye && !st.used.byeReply && (st.msgs>3)){ st.used.byeReply=1; lines.push(ch.bye); }
  if(!lines.length){ const qa=[...(ch.qa||[]),...GENERIC_QA].find(q=>q.re.test(t)); if(qa) lines.push(pick(st,'qa'+qa.re.source,[].concat(qa.a))); }
  if(st.empathyOk && !st.used.empReply && st.concernAt>=0){ st.used.empReply=1; lines.push('Dank je, fijn dat je het begrijpt.'); }
  if(!st.used.byeReply){ const beat=runBeat(c,st); if(beat) lines.push(beat); }
  if(!lines.length) lines.push(t.trim().endsWith('?') ? pick(st,'fq',['Hm, dat weet ik niet.','Wat bedoel je precies?','Goede vraag …']) : pick(st,'fill',ch.fill));

  if(st.ai && SAMPLE){
    st.busy=true; render(); scrollLog();
    try{
      const transcript=st.log.slice(-14).map(m=>(m.k==='s'?'Stagiair: ':m.k==='c'?ch.short+': ':'[')+m.t+(m.k==='a'||m.k==='n'?']':'')).join('\n');
      const prompt=`${ch.persona}

Je speelt deze rol (${ch.role}) in een oefen-rollenspel voor vmbo-leerlingen Zorg & Welzijn (examen Mens & Omgeving). Regels:
- Antwoord in eenvoudig Nederlands (B1), 1 tot 3 korte zinnen. Je spreekt de stagiair aan met "je".
- Blijf in je rol. Geef geen tips, geen uitleg en geen beoordeling. Vraag niet zelf naar informatie die de stagiair vergeet.
- Non-verbaal gedrag zet je tussen *sterretjes*.

Gesprek tot nu toe:
${transcript}

Jouw antwoord moet deze inhoud bevatten (de betekenis precies behouden, je mag het natuurlijker zeggen): ${lines.join(' ')}

Geef alleen jouw antwoord.`;
      const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),12000);
      const res=await Promise.race([SAMPLE(prompt,{modelTier:'quick', cache:false, signal:ctl.signal}), new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),12500))]);
      clearTimeout(to);
      const txt=(res&&res.text||'').trim();
      if(txt) lines=[txt.replace(/^[a-zë ]+:\s*/i,'')];
    }catch(e){ if(e&&e.code==='not_granted'){ SAMPLE=null; st.ai=false; AI_STATE='off'; AI_WHY='Je gaf geen toestemming voor AI. Het gesprek werkt nu met vaste zinnen.'; }
      else { st.ai=false; pushLog(st,'n','De AI reageerde niet op tijd. Het gesprek gaat verder met vaste zinnen.'); } }
    st.busy=false;
  }
  lines.forEach(l=>{ const act=l.startsWith('*')&&l.endsWith('*')&&l.indexOf('*',1)===l.length-1; pushLog(st, act?'a':'c', act?l.slice(1,-1):l); });
  render(); scrollLog(); $('#say')?.focus();
}

function critList(c,st){
  const ch=c.talk;
  return ch.criteria.map(sec=>{
    if(sec.items==='FACTS') return {...sec, items:ch.facts.map(f=>({l:f.l, ok:s=>fact(s,f.id), tip:'Kijk in je aantekeningen en geef dit door.'}))};
    if(sec.items==='NOTE') return {...sec, items:ch.note.fields.map(f=>({l:f.l, ok:s=>f.ok(s.note[f.k]||''), tip:ch.note.tips[f.k]}))};
    return sec;
  });
}
function finishChat(c,st){
  stopAll();
  if(!st.said.bye) pushLog(st,'c',c.talk.bye);
  if(c.talk.note && st.phase!=='note'){ st.phase='note'; st.peekOpen=false; render(); window.scrollTo(0,0); return; }
  scoreChat(c,st);
}
function scoreChat(c,st){
  st.phase='done';
  const secs=critList(c,st).map(s=>scoreSection(s,st));
  const score=secs.reduce((a,s)=>a+s.pts,0);
  R(c.id).o3={score, secs:secs.map(s=>({code:s.code,pts:s.pts,max:s.max})), mode:st.mode, peeks:st.peeks, hints:st.hints};
  st.secs=secs; save(); render(); window.scrollTo(0,0);
}

function assessView(c,st){

  return `<div class="opd">${opdHead(3,5)}<div class="content assess">
    <h2>Beoordeling: ${esc(c.talk.title.toLowerCase())}</h2>
    <div class="total"><b>${score}</b><span>van 5 punten</span></div>
    <p class="chip ${st.mode==='examen'?'done':(st.peeks||st.hints)?'warn':'blue'}" style="align-self:flex-start">${st.mode==='examen'?'Examenmodus · zonder hulp':(st.mode==='tussen'?'Tussenmodus':'Oefenmodus')+' · '+(st.peeks?st.peeks+'× gespiekt':'niet gespiekt')+(st.mode==='tussen'?' · '+(st.hints?st.hints+'× hint':'geen hints'):'')}</p>
    ${st.jeCount>0?`<p class="chip warn" style="align-self:flex-start">Je zei ${st.jeCount}× “je/jij”. Gebruik steeds “u”.</p>`:''}
    ${secs.map(s=>secHTML(s)).join('')}
    <div id="aifb"></div>
    <details class="docent"><summary>Gesprek teruglezen</summary><div class="log" style="max-height:360px">${st.log.map(m=>`<div class="msg ${m.k}">${m.k==='s'?esc(m.t):fmtAct(m.t)}</div>`).join('')}</div></details>
    <div class="row">
      ${SAMPLE?'<button class="btn ghost" id="ask-fb">Vraag AI om een top en een tip</button>':''}
      <button class="btn ghost" id="chat-again">Opnieuw oefenen</button>
      <button class="btn primary" data-go="o4">Naar opdracht 4</button>
    </div>
  </div></div>`;
}
function bindAssess(c,st){
  $('#chat-again').onclick=()=>{ runtime.chat=newChat(c); render(); };
  const f=$('#ask-fb'); if(f) f.onclick=async()=>{
    const box=$('#aifb'); box.innerHTML='<div class="feedbackai">Feedback wordt geschreven …</div>'; f.disabled=true;
    try{
      const tr=st.log.map(m=>(m.k==='s'?'Stagiair: ':m.k==='c'?c.talk.short+': ':'Handeling: ')+m.t).join('\n');
      const crit=st.secs.map(s=>s.code+' '+s.title+': '+s.items.map(i=>(i.ok?'[goed] ':'[mist] ')+i.l).join('; ')).join('\n');
      const res=await SAMPLE(`Je bent een vriendelijke docent Zorg & Welzijn op het vmbo (${S.level.toUpperCase()}). Een leerling deed een oefen-rollenspel “${c.talk.title}” met ${c.talk.name} (${c.talk.role}). Geef in eenvoudig Nederlands (B1) precies één TOP (wat ging goed, met een voorbeeld uit het gesprek) en één TIP (wat kan beter, met een concrete zin die de leerling de volgende keer kan zeggen of doen). Maximaal 80 woorden. Spreek de leerling aan met "je".\n\nBeoordeling:\n${crit}\n\nGesprek:\n${tr}`,{modelTier:'quick',cache:false,onText:({text})=>{box.innerHTML='<div class="feedbackai">'+esc(text)+'</div>';}});
      box.innerHTML='<div class="feedbackai">'+esc(res.text)+'</div>';
    }catch(e){ box.innerHTML='<p class="small muted">AI-feedback is nu niet beschikbaar.</p>'; }
  };
}

/* =========================================================
   OPDRACHT 4: PRAKTIJKOPDRACHT (wassen/strijken, schoonmaken) of FACET (was en textiel)
   ========================================================= */
const facetCfg=(c)=>({key:'quiz4', nr:4, max:6, save:'o4', byLevel:false, title:c.prak.title, intro:c.prak.text, set:()=>c.prak.qs, next:'res'});
function newPrak(c){
  const p=c.prak, st={ans:{}, checked:{}, seq:{}, pool:{}, opt:{}, pick:{}, why:{}, hint:{}, started:false};
  p.sections.forEach(sec=>sec.parts.forEach(pt=>{
    if(pt.t==='order'){ st.pool[pt.k]=shuffle(pt.steps.map((_,i)=>i)); st.seq[pt.k]=[]; }
    if(pt.t==='one') st.opt[pt.k]=shufQ(pt);
    if(pt.t==='mats'||pt.t==='multi') st.opt[pt.k]=shuffle(pt.o);
    if(pt.t==='matrix') st.opt[pt.k]=shuffle(pt.rows);
    if(pt.t==='oral') st.pick[pt.k]=pt.pairs.map(pair=>shufQ(pair[Math.floor(Math.random()*pair.length)]));
  }));
  st.whyQ=(p.why||[]).map(shufQ);
  return st;
}
function orderScore(seq){
  let ok=0,tot=0; for(let i=0;i<seq.length;i++) for(let j=i+1;j<seq.length;j++){ tot++; if(seq[i]<seq[j]) ok++; }
  if(seq.every((v,i)=>v===i)) return 5;
  const f=ok/tot; return f>=.95?4:f>=.85?3:f>=.7?2:f>=.55?1:0;
}
/* fouten per onderdeel */
function partFouten(pt,st){
  const a=st.ans[pt.k];
  if(pt.t==='one') return a===st.opt[pt.k].a?0:1;
  if(pt.t==='mats'||pt.t==='multi'){ const o=st.opt[pt.k]; return o.every((x,i)=>!!(a&&a[i])===x.ok)?0:1; }
  if(pt.t==='matrix'){ const rows=st.opt[pt.k]; return rows.every((r,i)=>a&&a[i]===r.a)?0:1; }
  if(pt.t==='order'){ const s=orderScore(st.seq[pt.k]); st.ordPts=st.ordPts||{}; st.ordPts[pt.k]=s; return s===5?0:s>=3?1:2; }
  if(pt.t==='oral'){ const qs=st.pick[pt.k]; return qs.filter((q,i)=>!(a&&a[i]===q.a)).length; }
  return 0;
}
function partComplete(pt,st){
  const a=st.ans[pt.k];
  if(pt.t==='one') return a!==undefined;
  if(pt.t==='mats'||pt.t==='multi') return !!a && Object.values(a).some(Boolean);
  if(pt.t==='matrix') return !!a && st.opt[pt.k].every((_,i)=>a[i]!==undefined);
  if(pt.t==='order') return st.seq[pt.k].length===pt.steps.length;
  if(pt.t==='oral') return !!a && st.pick[pt.k].every((_,i)=>a[i]!==undefined);
  return true;
}
function secScore(sec,st){
  const f=sec.parts.map(pt=>partFouten(pt,st));
  const tot=f.reduce((x,y)=>x+y,0);
  if(sec.mode==='minus') return Math.max(0,sec.max-tot);
  if(sec.mode==='all') return tot===0?sec.max:0;
  if(sec.mode==='count'){ const pt=sec.parts[0]; return Math.min(sec.max, st.pick[pt.k].length-tot); }
  return 0;
}
function partHTML(pt,st,locked){
  const a=st.ans[pt.k];
  const head=`<p class="qq">${esc(pt.q||'')}</p>`;
  if(pt.t==='one'){ const q=st.opt[pt.k];
    return `${q.care?careRow(q.care):''}${head}<div class="mcl">${q.o.map((o,j)=>`<label class="mco ${locked?(j===q.a?'right':(j===a?'wrong':'')):''}"><input type="radio" name="p_${pt.k}" data-pone="${pt.k}:${j}" ${a===j?'checked':''} ${locked?'disabled':''}><span>${esc(o)}</span></label>`).join('')}</div>`; }
  if(pt.t==='multi'){ const o=st.opt[pt.k];
    return `${head}<div class="mcl">${o.map((x,i)=>`<label class="mco ${locked?(x.ok?(a&&a[i]?'right':'wrong'):(a&&a[i]?'wrong':'')):''}"><input type="checkbox" data-pmul="${pt.k}:${i}" ${a&&a[i]?'checked':''} ${locked?'disabled':''}><span>${esc(x.l)}${locked&&x.ok&&!(a&&a[i])?' <b>(vergeten)</b>':''}</span></label>`).join('')}</div>`; }
  if(pt.t==='mats'){ const o=st.opt[pt.k];
    return `${head}<div class="mats">${o.map((m,i)=>`<button type="button" class="mat ${locked?(m.ok?(a&&a[i]?'right':'wrong'):(a&&a[i]?'wrong':'')):''}" data-pmat="${pt.k}:${i}" aria-pressed="${!!(a&&a[i])}" ${locked?'disabled':''}>${ico(m.i)}<span>${esc(m.l)}</span></button>`).join('')}</div>`; }
  if(pt.t==='matrix'){ const rows=st.opt[pt.k];
    return `${head}<div class="tablewrap"><table class="mx"><thead><tr><th></th>${pt.cols.map(cn=>`<th>${esc(cn)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr class="${locked?(a&&a[i]===r.a?'right':'wrong'):''}"><td>${esc(r.s)}</td>${pt.cols.map((_,j)=>`<td class="c"><input type="radio" name="pm_${pt.k}_${i}" data-pmx="${pt.k}:${i}:${j}" aria-label="${esc(r.s)}: ${esc(pt.cols[j])}" ${a&&a[i]===j?'checked':''} ${locked?'disabled':''}>${locked&&j===r.a?'<span class="ok">✓</span>':''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }
  if(pt.t==='order'){ const seq=st.seq[pt.k], placed=new Set(seq);
    return `${head}<p class="small muted">Tik op een stap om hem achter aan jouw volgorde te zetten. Met ↑ ↓ schuif je, met ✕ haal je hem terug.</p>
      ${S.level==='bb'&&!locked?`<div class="row"><button class="btn ghost sm" data-phint="${pt.k}">${st.hint[pt.k]?'Hint: de eerste stap is “'+esc(pt.steps[0])+'”':'Geef me een hint'}</button></div>`:''}
      <div class="ordergrid">
        <div class="pool"><h4>Stappen</h4>${st.pool[pt.k].filter(i=>!placed.has(i)).map(i=>`<button type="button" class="stepc" data-padd="${pt.k}:${i}" ${locked?'disabled':''}><span class="no">+</span><span>${esc(pt.steps[i])}</span><span></span></button>`).join('')||'<p class="small muted">Alle stappen staan in je volgorde.</p>'}</div>
        <div class="seq"><h4>Jouw volgorde</h4>${seq.map((i,pos)=>`<div class="stepc ${locked?(i===pos?'right':'wrong'):''}"><span class="no">${pos+1}</span><span>${esc(pt.steps[i])}${locked&&i!==pos?`<span class="tip">Hoort op plek ${i+1}</span>`:''}</span>${locked?'<span></span>':`<span class="mv"><button type="button" data-pup="${pt.k}:${pos}" aria-label="Omhoog">↑</button><button type="button" data-pdn="${pt.k}:${pos}" aria-label="Omlaag">↓</button><button type="button" data-prem="${pt.k}:${pos}" aria-label="Terugzetten">✕</button></span>`}</div>`).join('')||'<p class="small muted">Nog leeg.</p>'}</div>
      </div>`; }
  if(pt.t==='oral'){ const qs=st.pick[pt.k];
    return `<p class="small muted">De examinator stelt je ${qs.length} vragen. Kies het goede antwoord.</p>${qs.map((q,k)=>`<div class="card q">${q.care?careRow(q.care):''}${q.table?tableHTML(q.table):''}<b>${k+1}. ${esc(q.q)}</b><div class="mcl">${q.o.map((o,j)=>`<label class="mco ${locked?(j===q.a?'right':(a&&a[k]===j?'wrong':'')):''}"><input type="radio" name="po_${pt.k}_${k}" data-poral="${pt.k}:${k}:${j}" ${a&&a[k]===j?'checked':''} ${locked?'disabled':''}><span>${esc(o)}</span></label>`).join('')}</div></div>`).join('')}`; }
  return '';
}
function prakView(c){
  const p=c.prak;
  if(p.type==='facet') return qzView(c,facetCfg(c));
  const st=runtime.prak ||= newPrak(c);
  const intro=`<div class="boekje"><p>${esc(p.text)}</p><ul>${p.tasks.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
    ${p.etiket?`<div><b>Behandelingsetiket</b>${careRow(p.etiket)}<p class="small muted">${p.etiket.map(k=>careSym(k).match(/aria-label="([^"]+)"/)[1]).join(' · ')}</p></div>`:''}</div>`;
  if(!st.started) return `<div class="opd">${opdHead(4,6)}<div class="content">
    <h2>${esc(p.title)}</h2>${intro}
    <div><h3 style="margin-bottom:8px">Klaarmaken: wat hoort bij een goede beroepshouding?</h3>
      <p class="small muted" style="margin-bottom:8px">Vink aan wat juist is. Dit telt niet mee voor je punten, maar de examinator let er wel op.</p>
      <div class="prep">${PREP.map(x=>`<label class="check"><input type="checkbox" data-prep="${x.id}" ${st.prep&&st.prep[x.id]?'checked':''}><span>${esc(x.label)}</span></label>`).join('')}</div></div>
    <div class="row"><button class="btn primary" id="pk-start">Start de opdracht</button></div>
  </div></div>`;
  const allChecked=p.sections.every(s=>st.checked[s.code]);
  let total=0;
  const secs=p.sections.map(sec=>{ const locked=!!st.checked[sec.code]; const ready=sec.parts.every(pt=>partComplete(pt,st));
    const pts=locked?secScore(sec,st):null; if(locked) total+=pts;
    return `<section class="q card">
      <div class="qhead"><h3>${sec.code} · ${esc(sec.title)}</h3><span class="chip ${locked?(pts===sec.max?'done':pts>0?'warn':'bad'):''}">${locked?pts+'/':''}${sec.max}p</span></div>
      ${sec.parts.map(pt=>`<div class="part">${partHTML(pt,st,locked)}</div>`).join('')}
      ${locked?`<ul class="errlist">${sec.parts.filter(pt=>pt.aspect).map(pt=>{const f=partFouten(pt,st); return `<li><span class="mark ${f?'n':'y'}">${f?'✗':'✓'}</span><span>${esc(pt.aspect)}${f&&pt.tip?`<span class="tip">Tip: ${esc(pt.tip)}</span>`:''}</span></li>`;}).join('')}</ul>`
        :`<div class="row"><button class="btn primary sm" data-pcheck="${sec.code}" ${ready?'':'disabled'}>Controleer ${sec.code}</button>${ready?'':'<span class="small muted">Maak eerst alles af.</span>'}</div>`}
    </section>`; }).join('');
  let end='';
  if(allChecked){
    R(c.id).o4={score:total, secs:p.sections.map(s=>({code:s.code,pts:secScore(s,st),max:s.max}))}; save();
    end=`${S.level==='kb'&&st.whyQ.length?`<section class="q"><h3>Waarom? <span class="muted small">(kader · oefening, geen punten)</span></h3>
      ${st.whyQ.map((w,wi)=>`<div class="card q"><b>${esc(w.q)}</b><div class="opts">${w.o.map((o,j)=>`<button class="opt ${st.why[wi]!==undefined?(j===w.a?'right':(j===st.why[wi]?'wrong':'')):''}" data-why="${wi}:${j}" ${st.why[wi]!==undefined?'disabled':''}><span class="l">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`).join('')}</div></div>`).join('')}</section>`:''}
      <div class="total"><b>${total}</b><span>van 6 punten</span></div>
      <div class="row"><button class="btn ghost" id="pk-again">Opnieuw oefenen</button><button class="btn primary" data-go="res">Naar de uitslag</button></div>`;
  }
  return `<div class="opd">${opdHead(4,6)}<div class="content"><h2>${esc(p.title)}</h2>
    ${st.prepMsg&&st.prepMsg.length?`<p class="chip warn" style="align-self:flex-start">Let op je beroepshouding: ${st.prepMsg.map(x=>esc(x.label.toLowerCase())).join('; ')}</p>`:''}
    <details class="opdr"><summary>Opdracht bekijken</summary>${intro}</details>
    ${secs}${end}</div></div>`;
}
function bindPrak(c){
  const p=c.prak; bindIntro();
  if(p.type==='facet'){ qzBind(c,facetCfg(c)); return; }
  const st=runtime.prak, keep=()=>{ const y=window.scrollY; render(); window.scrollTo(0,y); };
  if(!st.started){
    document.querySelectorAll('[data-prep]').forEach(i=>i.onchange=()=>{ (st.prep ||= {})[i.dataset.prep]=i.checked; });
    $('#pk-start').onclick=()=>{ st.started=true; st.prepMsg=PREP.filter(x=>!!(st.prep&&st.prep[x.id])!==x.ok); render(); window.scrollTo(0,0); };
    return;
  }
  const A=(k)=>(st.ans[k] ||= {});
  document.querySelectorAll('[data-pone]').forEach(b=>b.onchange=()=>{ const [k,j]=b.dataset.pone.split(':'); st.ans[k]=+j; keep(); });
  document.querySelectorAll('[data-pmul]').forEach(b=>b.onchange=()=>{ const [k,i]=b.dataset.pmul.split(':'); A(k)[i]=b.checked; keep(); });
  document.querySelectorAll('[data-pmat]').forEach(b=>b.onclick=()=>{ const [k,i]=b.dataset.pmat.split(':'); A(k)[i]=!A(k)[i]; keep(); });
  document.querySelectorAll('[data-pmx]').forEach(b=>b.onchange=()=>{ const [k,i,j]=b.dataset.pmx.split(':'); A(k)[i]=+j; keep(); });
  document.querySelectorAll('[data-poral]').forEach(b=>b.onchange=()=>{ const [k,i,j]=b.dataset.poral.split(':'); A(k)[i]=+j; keep(); });
  document.querySelectorAll('[data-phint]').forEach(b=>b.onclick=()=>{ st.hint[b.dataset.phint]=true; keep(); });
  document.querySelectorAll('[data-padd]').forEach(b=>b.onclick=()=>{ const [k,i]=b.dataset.padd.split(':'); st.seq[k].push(+i); keep(); });
  document.querySelectorAll('[data-pup]').forEach(b=>b.onclick=()=>{ const [k,p]=b.dataset.pup.split(':').map((x,n)=>n?+x:x); const s=st.seq[k]; if(p>0)[s[p-1],s[p]]=[s[p],s[p-1]]; keep(); });
  document.querySelectorAll('[data-pdn]').forEach(b=>b.onclick=()=>{ const [k,p]=b.dataset.pdn.split(':').map((x,n)=>n?+x:x); const s=st.seq[k]; if(p<s.length-1)[s[p+1],s[p]]=[s[p],s[p+1]]; keep(); });
  document.querySelectorAll('[data-prem]').forEach(b=>b.onclick=()=>{ const [k,p]=b.dataset.prem.split(':').map((x,n)=>n?+x:x); st.seq[k].splice(p,1); keep(); });
  document.querySelectorAll('[data-pcheck]').forEach(b=>b.onclick=()=>{ st.checked[b.dataset.pcheck]=true; keep(); });
  document.querySelectorAll('[data-why]').forEach(b=>b.onclick=()=>{ const [w,j]=b.dataset.why.split(':').map(Number); st.why[w]=j; keep(); });
  const ag=$('#pk-again'); if(ag) ag.onclick=()=>{ runtime.prak=newPrak(c); runtime.prak.started=true; render(); window.scrollTo(0,0); };
}

/* ---------- start ---------- */
render();
(async()=>{
  try{ if(window.claude&&window.claude.use){
      const [s,t]=await Promise.all([window.claude.use('sample').catch(()=>null), window.claude.use('tts').catch(()=>null)]);
      TTS=t||null;
      if(s){ SAMPLE=s; AI_STATE='on'; } else AI_STATE='off';
    } else AI_STATE='none'; }
  catch(e){ AI_STATE='off'; }
  if(view.screen==='case'&&view.tab==='o3' && !(runtime.chat&&runtime.chat.busy)){ const v=document.getElementById('say'); const keep=v?v.value:''; render(); const n=document.getElementById('say'); if(n&&keep) n.value=keep; }
})();
